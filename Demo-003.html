<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鬼谷倖存者 (Demo-003: 萬法歸宗)</title>
    <!-- 引入 Three.js 作為 3D 特效引擎，若失敗則自動降級 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; user-select: none; }
        /* 雙層 Canvas 架構 */
        #bg-3d-canvas { position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none; }
        #gameCanvas { position: absolute; top: 0; left: 0; z-index: 2; background: transparent; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 10; }
        .bar-container { position: absolute; top: 10px; left: 10px; width: calc(100% - 150px); height: 20px; background: #333; border: 2px solid #555; border-radius: 10px; overflow: hidden; }
        #exp-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%); transition: width 0.2s; }
        .stats { position: absolute; top: 40px; left: 15px; color: white; text-shadow: 1px 1px 2px black; font-size: 14px; line-height: 1.6; }
        #timer { position: absolute; top: 40px; right: 15px; color: white; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px black; }
        
        .btn { pointer-events: auto; background: rgba(20,20,20,0.85); color: #c9a562; border: 1px solid #c9a562; padding: 8px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; transition: 0.2s; display: inline-block; text-shadow: 1px 1px 2px black; }
        .btn:hover { background: #c9a562; color: #000; box-shadow: 0 0 10px #c9a562; }
        #pause-btn { position: absolute; top: 5px; right: 10px; z-index: 50; }
        #auto-btn { position: absolute; top: 5px; right: 80px; z-index: 50; border-color: #3498db; color: #3498db; }
        .auto-active { background: #3498db !important; color: white !important; }

        #joystick-zone { position: absolute; bottom: 10%; left: 10%; width: 120px; height: 120px; pointer-events: auto; display: none; }
        #joystick-base { width: 100%; height: 100%; background: rgba(255, 255, 255, 0.15); border-radius: 50%; position: relative; border: 1px solid rgba(255,255,255,0.3); }
        #joystick-stick { width: 40px; height: 40px; background: rgba(255, 255, 255, 0.6); border-radius: 50%; position: absolute; top: 40px; left: 40px; }
        
        .modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 15, 15, 0.95); border: 2px solid #c9a562; padding: 25px; border-radius: 12px; color: white; text-align: center; pointer-events: auto; width: 85%; max-width: 500px; z-index: 100; max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
        .card { background: #2a2a2a; border: 1px solid #555; padding: 12px; margin: 8px 0; border-radius: 8px; cursor: pointer; transition: 0.2s; position: relative; text-align: left;}
        .card:hover { border-color: #c9a562; background: #3a3a3a; transform: translateY(-2px); }
        .card-title { font-weight: bold; font-size: 16px; color: #f1c40f; margin-bottom: 4px; }
        .affix-high { border-color: #e74c3c; box-shadow: inset 0 0 15px rgba(231,76,60,0.15); }
        .affix-high .card-title { color: #ff7675; }
        
        .mode-btn { width: 100%; box-sizing: border-box; margin: 6px 0; font-size: 16px; padding: 12px; }
        #damage-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(255,0,0,0.3); pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 40;}
        
        /* Navbar for Shop/Crafting */
        .nav-tabs { display: flex; border-bottom: 1px solid #555; margin-bottom: 15px; }
        .nav-tab { flex: 1; padding: 10px; cursor: pointer; color: #aaa; background: #222; border: 1px solid #555; border-bottom: none; }
        .nav-tab.active { background: #c9a562; color: #000; font-weight: bold; }

        @media (hover: none) and (pointer: coarse) { #joystick-zone { display: block; } }
    </style>
</head>
<body>
    <canvas id="bg-3d-canvas"></canvas>
    <canvas id="gameCanvas"></canvas>
    <div id="damage-overlay"></div>
    
    <div id="ui-layer">
        <div class="bar-container"><div id="exp-bar"></div></div>
        <button id="auto-btn" class="btn" onclick="toggleAuto()">🤖 託管</button>
        <button id="pause-btn" class="btn" onclick="togglePause()">暫停</button>
        <div class="stats" id="stats-display"></div>
        <div id="timer">00:00</div>
        <div id="joystick-zone"><div id="joystick-base"><div id="joystick-stick"></div></div></div>
    </div>

    <!-- Start Modal -->
    <div id="start-modal" class="modal" style="display: block;">
        <h1 style="color: #c9a562; margin-top: 0; font-size: 32px; letter-spacing: 2px;">鬼谷倖存者</h1>
        <p style="color: #aaa; font-size: 14px;">WASD 或 搖桿移動，靠近自動攻擊</p>
        <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 5px; margin-bottom: 15px;">
            <span style="color:#00f2fe;">靈石: <span id="start-stones">0</span></span> | 
            <span style="color:#e74c3c;">妖丹: <span id="start-cores">0</span></span> | 
            <span style="color:#95a5a6;">玄鐵: <span id="start-irons">0</span></span>
        </div>
        <button class="btn mode-btn" onclick="startGame(300)">切磋模式 (5 分鐘) - 快速體驗</button>
        <button class="btn mode-btn" onclick="startGame(600)">歷練模式 (10 分鐘) - 標準修行</button>
        <button class="btn mode-btn" onclick="startGame(900)">生死模式 (15 分鐘) - 極限挑戰</button>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn" style="flex:1; background: #8e44ad; color: white;" onclick="openShop('start', 'shop')">聚寶閣</button>
            <button class="btn" style="flex:1; background: #d35400; color: white;" onclick="openShop('start', 'craft')">神兵坊</button>
        </div>
    </div>

    <!-- Level Up Modal -->
    <div id="levelup-modal" class="modal">
        <h2 style="color: #c9a562;">境界突破</h2>
        <p>選擇一項功法參悟：</p>
        <div id="upgrade-options"></div>
    </div>
    
    <!-- Chest Modal -->
    <div id="chest-modal" class="modal">
        <h2 style="color: #f1c40f; font-size: 28px;">機緣降臨！</h2>
        <div id="chest-reward" style="font-size: 18px; line-height: 1.8; color: #00f2fe; margin: 20px 0;"></div>
        <button class="btn" onclick="closeChest()" style="font-size: 18px; padding: 10px 30px;">收下</button>
    </div>

    <div id="gameover-modal" class="modal">
        <h2 id="go-title" style="color: #e74c3c; font-size: 32px;">道死身消</h2>
        <p id="go-stats" style="font-size: 16px; line-height: 1.6;"></p>
        <button class="btn" onclick="location.reload()" style="margin-top: 10px;">輪迴重修 (首頁)</button>
    </div>

    <div id="pause-modal" class="modal">
        <h2 style="color: #c9a562;">修行暫停</h2>
        <button class="btn mode-btn" onclick="togglePause()">繼續修行</button>
        <button class="btn mode-btn" onclick="location.reload()" style="border-color: #e74c3c; color: #e74c3c;">放棄本次輪迴</button>
    </div>

    <!-- Shop / Crafting Hub Modal -->
    <div id="hub-modal" class="modal" style="padding-top: 15px;">
        <div class="nav-tabs">
            <div id="tab-shop" class="nav-tab active" onclick="switchHubTab('shop')">聚寶閣 (靈石)</div>
            <div id="tab-craft" class="nav-tab" onclick="switchHubTab('craft')">神兵坊 (材料)</div>
            <div id="tab-mastery" class="nav-tab" onclick="switchHubTab('mastery')">武學 (熟練度)</div>
        </div>
        <div style="margin-bottom: 15px; font-size: 14px; text-align: left; padding: 5px; background: rgba(0,0,0,0.5); border-radius: 5px;">
            💎 靈石: <span id="hub-stones" style="color:#f1c40f">0</span> &nbsp;|&nbsp; 
            🔴 妖丹: <span id="hub-cores" style="color:#e74c3c">0</span> &nbsp;|&nbsp; 
            ⛓️ 玄鐵: <span id="hub-irons" style="color:#95a5a6">0</span>
        </div>
        <div id="hub-content" style="text-align: left; max-height: 350px; overflow-y:auto; padding-right:5px;"></div>
        <button class="btn" onclick="closeHub()" style="margin-top: 15px; width: 100%;">返回</button>
    </div>

<script>
/**
 * 模組 1: 3D 視覺隔離引擎 (VisualEngine3D)
 * 防呆機制: 若 Three.js 載入失敗或 WebGL 不支援，自動降級，不影響 2D 核心。
 */
const VisualEngine3D = {
    isReady: false, scene: null, camera: null, renderer: null, particles: null,
    init: function() {
        if (typeof THREE === 'undefined') { console.warn("3D Engine Offline. Running in Pure 2D mode."); return; }
        try {
            const canvas3d = document.getElementById('bg-3d-canvas');
            this.renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: false });
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.scene = new THREE.Scene();
            this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            this.camera.position.z = 50;

            // 創建星空/靈氣粒子背景
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for ( let i = 0; i < 500; i ++ ) {
                vertices.push( THREE.MathUtils.randFloatSpread( 200 ) ); // x
                vertices.push( THREE.MathUtils.randFloatSpread( 200 ) ); // y
                vertices.push( THREE.MathUtils.randFloatSpread( 200 ) ); // z
            }
            geometry.setAttribute( 'position', new THREE.Float32BufferAttribute( vertices, 3 ) );
            const material = new THREE.PointsMaterial({ color: 0x00f2fe, size: 0.5, transparent: true, opacity: 0.5 });
            this.particles = new THREE.Points(geometry, material);
            this.scene.add(this.particles);

            this.isReady = true;
            this.animate();
        } catch(e) { console.error("3D Error:", e); this.isReady = false; }
    },
    animate: function() {
        if(!this.isReady) return;
        requestAnimationFrame(() => this.animate());
        if(this.particles) {
            this.particles.rotation.x += 0.0005;
            this.particles.rotation.y += 0.001;
        }
        this.renderer.render(this.scene, this.camera);
    },
    resize: function() {
        if(!this.isReady) return;
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
    }
};
VisualEngine3D.init();

/**
 * 模組 2: 核心 2D 引擎與資料庫 (Core & Data)
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;

const UI = {
    layer: document.getElementById('ui-layer'), expBar: document.getElementById('exp-bar'),
    stats: document.getElementById('stats-display'), timer: document.getElementById('timer'),
    startModal: document.getElementById('start-modal'), levelUpModal: document.getElementById('levelup-modal'),
    optionsContainer: document.getElementById('upgrade-options'), chestModal: document.getElementById('chest-modal'),
    gameOverModal: document.getElementById('gameover-modal'), pauseModal: document.getElementById('pause-modal'),
    hubModal: document.getElementById('hub-modal'), dmgOverlay: document.getElementById('damage-overlay'),
    joyBase: document.getElementById('joystick-base'), joyStick: document.getElementById('joystick-stick'),
    autoBtn: document.getElementById('auto-btn')
};

// 嚴格讀取與版本遷移 (Migrate to v3)
let rawData = localStorage.getItem('guigu_save_v3');
let metaData = rawData ? JSON.parse(rawData) : {
    spiritStones: 0, cores: 0, irons: 0, 
    hpBonus: 0, atkBonus: 0, revives: 0, startMagnet: false, startAoe: false,
    apprenticeActive: false, 
    equipment: { weapon: null, armor: null }, // 神兵工匠
    mastery: {} // 武學熟練度
};
document.getElementById('start-stones').innerText = metaData.spiritStones;
document.getElementById('start-cores').innerText = metaData.cores || 0;
document.getElementById('start-irons').innerText = metaData.irons || 0;

let sessionLoot = { stones: 0, cores: 0, irons: 0, revives: 0 };
let hubReturnTo = 'start'; 

// 商店目錄
const shopCatalog = [
    { id: 'hp', name: '洗髓丹 (初階)', desc: '永久氣血+20', cost: 15, max: 20 },
    { id: 'atk', name: '聚氣散 (初階)', desc: '永久攻擊+5', cost: 20, max: 20 },
    { id: 'apprentice', name: '招募徒弟 (中階)', desc: '開局自動跟隨出戰', cost: 300, max: 1 },
    { id: 'revive', name: '九轉還魂丹 (頂級)', desc: '單局免死復活 1 次', cost: 1000, max: 2 }
];

// 裝備目錄 (Crafting)
const craftCatalog = [
    { id: 'w_sword', type: 'weapon', name: '精鐵飛劍', desc: '基礎攻擊力 +15', costCores: 2, costIrons: 10 },
    { id: 'w_demon', type: 'weapon', name: '斬妖泣血劍', desc: '基礎攻擊力 +40', costCores: 15, costIrons: 50 },
    { id: 'a_cloth', type: 'armor', name: '天蠶寶甲', desc: '基礎氣血 +100', costCores: 1, costIrons: 15 },
    { id: 'a_turtle', type: 'armor', name: '玄武靈鎧', desc: '基礎氣血 +300', costCores: 10, costIrons: 80 }
];

// 全域狀態機
let gameState = { isRunning: false, isAutoPilot: false, time: 0, maxTime: 300, kills: 0, lastTime: 0, camera: { x: 0, y: 0 }, spawns: {} };
let player, enemies = [], projectiles = [], enemyProjectiles = [], drops = [], floatTexts = [], aoeEffects = [], companions = [];
let input = { x: 0, y: 0 }, spawnerTimer = 0;

/**
 * 模組 3: 實體類別 (Entity Classes)
 */
class Player {
    constructor() {
        this.x = 0; this.y = 0; this.radius = 15; this.speed = 160; 
        
        // 疊加裝備與基礎屬性
        let equipHp = 0; if (metaData.equipment.armor === 'a_cloth') equipHp = 100; else if (metaData.equipment.armor === 'a_turtle') equipHp = 300;
        this.maxHp = 100 + (metaData.hpBonus * 20) + equipHp; this.hp = this.maxHp;
        this.level = 1; this.exp = 0; this.maxExp = 50;
        
        let equipAtk = 0; if (metaData.equipment.weapon === 'w_sword') equipAtk = 15; else if (metaData.equipment.weapon === 'w_demon') equipAtk = 40;
        let baseAtk = (metaData.atkBonus * 5) + equipAtk;
        
        this.weapons = [{ name: '清風劍氣', type: 'projectile', level: 1, damage: 15 + baseAtk, cooldown: 1.0, timer: 0, element: 'normal', pierce: 1 }];
        if(metaData.startAoe) this.weapons.push({ name: '八卦劍陣', type: 'aoe', level: 1, damage: 20 + baseAtk, cooldown: 3.0, radius: 120, timer: 0 });
        
        this.pickupRadius = 60 + (metaData.startMagnet ? 50 : 0);
        this.magnetTimer = 0;
    }
    update(dt) {
        // AI 託管運算 (覆寫 input)
        if (gameState.isAutoPilot) {
            let aiVec = {x: 0, y: 0};
            // 斥力
            enemies.forEach(e => {
                let d = Math.hypot(e.x - this.x, e.y - this.y);
                if (d < 180) { aiVec.x -= (e.x - this.x)/(d*d); aiVec.y -= (e.y - this.y)/(d*d); }
            });
            // 引力
            if (Math.hypot(aiVec.x, aiVec.y) < 0.001 && drops.length > 0) {
                let dTarget = drops[0];
                let d = Math.hypot(dTarget.x - this.x, dTarget.y - this.y);
                if(d > 0) { aiVec.x += (dTarget.x - this.x)/d; aiVec.y += (dTarget.y - this.y)/d; }
            }
            let aLen = Math.hypot(aiVec.x, aiVec.y);
            if(aLen > 0) { input.x = (aiVec.x/aLen); input.y = (aiVec.y/aLen); } else { input.x=0; input.y=0; }
        }

        if(input.x !== 0 || input.y !== 0) {
            let len = Math.hypot(input.x, input.y);
            this.x += (input.x / len) * this.speed * dt; this.y += (input.y / len) * this.speed * dt;
        }
        gameState.camera.x = this.x - canvas.width / 2; gameState.camera.y = this.y - canvas.height / 2;
        
        if (this.magnetTimer > 0) this.magnetTimer -= dt;

        this.weapons.forEach(w => {
            w.timer -= dt;
            if(w.timer <= 0) {
                // 熟練度加成套用
                let masteryLvl = metaData.mastery[w.name] || 0;
                let actualDmg = w.damage * (1 + masteryLvl * 0.02);
                let actualCd = Math.max(0.1, w.cooldown * Math.pow(0.99, masteryLvl)); // 減CD
                
                if (w.type === 'projectile') { if (this.fireProjectile(w, actualDmg)) w.timer = actualCd; } 
                else if (w.type === 'aoe') { this.fireAoe(w, actualDmg); w.timer = actualCd; }
            }
        });
    }
    fireProjectile(w, actualDmg) {
        if(enemies.length === 0) return false;
        let closest = enemies.reduce((c, e) => { let d = Math.hypot(this.x - e.x, this.y - e.y); return d < c.d ? {e: e, d: d} : c; }, {e: null, d: Infinity});
        if (closest.e && closest.d < 500) {
            let dx = closest.e.x - this.x; let dy = closest.e.y - this.y; let len = Math.hypot(dx, dy);
            projectiles.push(new Projectile(this.x, this.y, dx/len, dy/len, actualDmg, w.name, w.element, w.pierce));
            return true;
        }
        return false;
    }
    fireAoe(w, actualDmg) {
        let r = w.radius + (w.level * 10);
        aoeEffects.push(new AoeEffect(this.x, this.y, r));
        enemies.forEach(e => { if(Math.hypot(this.x - e.x, this.y - e.y) <= r + e.radius) e.takeDamage(actualDmg); });
    }
    gainExp(amt) {
        this.exp += amt;
        if(this.exp >= this.maxExp) { this.exp -= this.maxExp; this.level++; this.maxExp = Math.floor(this.maxExp * 1.5); triggerLevelUp(); }
        UI.expBar.style.width = `${(this.exp / this.maxExp) * 100}%`;
    }
}

class Companion {
    constructor(x, y, isPermanent) {
        this.x = x; this.y = y; this.radius = 12; this.speed = 180;
        this.isPermanent = isPermanent;
        this.hp = isPermanent ? 500 : 300; this.maxHp = this.hp;
        this.timer = isPermanent ? 9999 : 60; // 道友限時60秒
        this.markedForDeath = false; this.atkTimer = 0;
        this.color = isPermanent ? '#f39c12' : '#3498db'; // 徒弟橘色，道友藍色
    }
    update(dt) {
        this.timer -= dt; if(this.timer <= 0) this.markedForDeath = true;
        
        let closest = enemies.reduce((c, e) => { let d = Math.hypot(this.x - e.x, this.y - e.y); return d < c.d ? {e: e, d: d} : c; }, {e: null, d: Infinity});
        if(closest.e) {
            let dx = closest.e.x - this.x; let dy = closest.e.y - this.y;
            if (closest.d > 100) { this.x += (dx/closest.d)*this.speed*dt; this.y += (dy/closest.d)*this.speed*dt; } // 靠近
            
            this.atkTimer -= dt;
            if(this.atkTimer <= 0 && closest.d < 300) {
                projectiles.push(new Projectile(this.x, this.y, dx/closest.d, dy/closest.d, 20, '飛劍', 'normal', 1));
                this.atkTimer = 1.0;
            }
        } else {
            // 跟隨玩家
            let dx = player.x - this.x; let dy = player.y - this.y; let d = Math.hypot(dx,dy);
            if(d > 80) { this.x += (dx/d)*this.speed*dt; this.y += (dy/d)*this.speed*dt; }
        }
    }
    takeDamage(dmg) {
        this.hp -= dmg;
        if(this.hp <= 0 && !this.markedForDeath) {
            this.markedForDeath = true;
            floatTexts.push(new FloatText(this.x, this.y, this.isPermanent?"徒弟重傷退場!":"道友陣亡!", '#e74c3c'));
        }
    }
    draw(ctx, cam) {
        ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x-cam.x, this.y-cam.y, this.radius, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'red'; ctx.fillRect(this.x-cam.x-10, this.y-cam.y+15, 20, 3);
        ctx.fillStyle = '#2ecc71'; ctx.fillRect(this.x-cam.x-10, this.y-cam.y+15, 20*(this.hp/this.maxHp), 3);
    }
}

// 統一目標尋址器 (防空指標)
function getClosestTarget(ex, ey) {
    let targets = [player];
    companions.forEach(c => { if(!c.markedForDeath) targets.push(c); });
    return targets.reduce((c, t) => { 
        let d = Math.hypot(t.x - ex, t.y - ey);
        let weight = (t instanceof Companion) ? 1.5 : 1.0; // 仇恨加權
        let score = d / weight;
        return score < c.score ? {obj: t, score: score} : c; 
    }, {obj: player, score: Infinity}).obj;
}

class Enemy {
    constructor(x, y, type) {
        this.x = x; this.y = y; this.type = type; this.markedForDeath = false; this.attackCooldown = 0;
        this.status = { burn: 0, burnTick: 0, freeze: 0 };
        this.skillTimer = 2.0; // 進階怪技能計時
        
        let diff = 1 + (gameState.time / 60) * 1.3; 
        switch(type) {
            case 'boss_tian': this.maxHp = 999999; this.speed = 350; this.radius = 40; this.damage = 9999; this.color = '#9b59b6'; break;
            case 'boss': this.maxHp = 5000 * diff; this.speed = 70; this.radius = 35; this.damage = 40; this.color = '#f1c40f'; break;
            case 'elite_blood': this.maxHp = 1200 * diff; this.speed = 80; this.radius = 25; this.damage = 30; this.color = '#c0392b'; break; // 血妖
            case 'elite_tree': this.maxHp = 900 * diff; this.speed = 40; this.radius = 25; this.damage = 20; this.color = '#1abc9c'; break; // 樹妖
            default: this.maxHp = 30 * diff; this.speed = 50 + (Math.random()*25); this.radius = 12; this.damage = 10; this.color = '#2ecc71';
        }
        this.hp = this.maxHp;
    }
    update(dt) {
        let currentSpeed = this.speed;
        if (this.status.freeze > 0) { this.status.freeze -= dt; currentSpeed *= 0.4; } 
        if (this.status.burn > 0) { 
            this.status.burn -= dt; this.status.burnTick -= dt;
            if(this.status.burnTick <= 0) { this.takeDamage(15); this.status.burnTick = 0.5; }
        }

        let target = getClosestTarget(this.x, this.y);
        let dx = target.x - this.x; let dy = target.y - this.y; let len = Math.hypot(dx, dy);
        
        // 進階怪行為
        if (this.type === 'elite_blood') {
            this.skillTimer -= dt;
            if (this.skillTimer <= 0) { currentSpeed *= 3.5; if (this.skillTimer < -0.5) this.skillTimer = 3.0; } // 衝刺
        } else if (this.type === 'elite_tree') {
            if (len < 300) currentSpeed = 0; // 保持距離
            this.skillTimer -= dt;
            if (this.skillTimer <= 0 && len < 400) {
                enemyProjectiles.push(new Projectile(this.x, this.y, dx/len, dy/len, 15, '毒液', 'enemy', 1));
                this.skillTimer = 2.5;
            }
        }

        if(len > 0) { this.x += (dx/len) * currentSpeed * dt; this.y += (dy/len) * currentSpeed * dt; }
        
        if (this.attackCooldown > 0) this.attackCooldown -= dt;
        if (len < this.radius + target.radius && this.attackCooldown <= 0) {
            if (target === player) takePlayerDamage(this.damage); else target.takeDamage(this.damage);
            this.attackCooldown = 1.0;
        }
    }
    takeDamage(dmg) {
        this.hp -= dmg; floatTexts.push(new FloatText(this.x, this.y - 20, Math.floor(dmg), '#fff'));
        if(this.hp <= 0 && !this.markedForDeath) {
            this.markedForDeath = true; gameState.kills++;
            
            // 掉落與材料
            if (this.type.includes('boss')) { drops.push(new Drop(this.x, this.y, 'chest')); sessionLoot.cores += 2; }
            else if (this.type.includes('elite')) { drops.push(new Drop(this.x, this.y, 'magnet')); sessionLoot.irons += 3; }
            else {
                let r = Math.random();
                if (r < 0.01) drops.push(new Drop(this.x, this.y, 'bomb'));
                else if (r < 0.03) drops.push(new Drop(this.x, this.y, 'heal'));
                else if (r < 0.04) drops.push(new Drop(this.x, this.y, 'companion')); // 求救信號
                else if (r < 0.06) sessionLoot.irons++; 
                else drops.push(new Drop(this.x, this.y, 'exp', 5 + (gameState.time/60)*2));
            }
            if (this.type.includes('boss') || this.type.includes('elite')) sessionLoot.stones += Math.floor(Math.random()*5)+2;
            else if (Math.random() < 0.1) sessionLoot.stones++;
        }
    }
    applyElement(el) { if (el === 'fire') this.status.burn = 3.0; else if (el === 'ice') this.status.freeze = 2.0; }
}

class Projectile {
    constructor(x, y, vx, vy, dmg, name, el, pierce) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.speed = el === 'enemy' ? 200 : 450; 
        this.damage = dmg; this.life = 2.0; this.markedForDeath = false;
        this.element = el; this.pierce = pierce || 1; this.hitTargets = [];
        this.isTracking = name === '萬劍歸宗';
        if(el === 'fire') this.color = '#ff4757'; else if(el === 'ice') this.color = '#74b9ff'; else if(el === 'enemy') this.color = '#27ae60'; else this.color = '#00ffff';
    }
    update(dt) {
        if (this.isTracking && enemies.length > 0 && this.element !== 'enemy') {
            let closest = enemies.reduce((c, e) => { let d = Math.hypot(this.x - e.x, this.y - e.y); return d < c.d ? {e: e, d: d} : c; }, {e: null, d: Infinity});
            if (closest.e) { let dx = closest.e.x - this.x; let dy = closest.e.y - this.y; let len = Math.hypot(dx, dy); this.vx += (dx/len)*5*dt; this.vy += (dy/len)*5*dt; let nLen = Math.hypot(this.vx, this.vy); this.vx /= nLen; this.vy /= nLen; }
        }
        this.x += this.vx * this.speed * dt; this.y += this.vy * this.speed * dt;
        this.life -= dt; if(this.life <= 0) this.markedForDeath = true;

        if (this.element === 'enemy') {
            let target = getClosestTarget(this.x, this.y);
            if(Math.hypot(this.x - target.x, this.y - target.y) < target.radius + 6) {
                if(target === player) takePlayerDamage(this.damage); else target.takeDamage(this.damage);
                this.markedForDeath = true;
            }
        } else {
            for(let e of enemies) {
                if(Math.hypot(this.x - e.x, this.y - e.y) < e.radius + 8 && !this.hitTargets.includes(e)) {
                    e.takeDamage(this.damage); if (this.element !== 'normal') e.applyElement(this.element);
                    this.hitTargets.push(e); this.pierce--; if(this.pierce <= 0) { this.markedForDeath = true; break; }
                }
            }
        }
    }
    draw(ctx, cam) { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x-cam.x, this.y-cam.y, this.element==='enemy'?8:6, 0, Math.PI*2); ctx.fill(); }
}

class AoeEffect {
    constructor(x, y, radius) { this.x = x; this.y = y; this.maxRadius = radius; this.radius = 0; this.life = 0.3; this.markedForDeath = false; }
    update(dt) { this.radius += (this.maxRadius - this.radius) * 12 * dt; this.life -= dt; if(this.life <= 0) this.markedForDeath = true; }
    draw(ctx, cam) { ctx.strokeStyle = `rgba(241, 196, 15, ${this.life * 3})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(this.x - cam.x, this.y - cam.y, this.radius, 0, Math.PI*2); ctx.stroke(); }
}

class Drop {
    constructor(x, y, type, expVal=0) {
        this.x = x; this.y = y; this.type = type; this.exp = expVal; this.markedForDeath = false;
        switch(type) {
            case 'heal': this.color = '#2ecc71'; this.radius = 6; break;
            case 'bomb': this.color = '#000'; this.radius = 8; break;
            case 'magnet': this.color = '#9b59b6'; this.radius = 6; break;
            case 'chest': this.color = '#f1c40f'; this.radius = 12; break;
            case 'companion': this.color = '#3498db'; this.radius = 8; break; // 求救符
            default: this.color = expVal > 20 ? '#e74c3c' : '#00f2fe'; this.radius = expVal > 20 ? 8 : 4;
        }
    }
    update(dt) {
        let dist = Math.hypot(player.x - this.x, player.y - this.y);
        let pullDist = player.magnetTimer > 0 ? 2000 : player.pickupRadius; 
        if(dist < pullDist) {
            this.x += ((player.x - this.x)/dist) * 450 * dt; this.y += ((player.y - this.y)/dist) * 450 * dt;
            if(dist < 15) {
                this.markedForDeath = true;
                switch(this.type) {
                    case 'heal': player.hp = Math.min(player.hp + player.maxHp*0.2, player.maxHp); floatTexts.push(new FloatText(player.x, player.y, "+HP", '#2ecc71')); break;
                    case 'bomb': enemies.forEach(e => e.takeDamage(9999)); floatTexts.push(new FloatText(player.x, player.y, "天雷炸裂!", '#fff')); break;
                    case 'magnet': player.magnetTimer = 0.5; floatTexts.push(new FloatText(player.x, player.y, "萬物聚靈!", '#9b59b6')); break;
                    case 'chest': triggerChest(); break;
                    case 'companion': companions.push(new Companion(this.x, this.y, false)); floatTexts.push(new FloatText(this.x, this.y, "道友相助!", '#3498db')); break;
                    default: player.gainExp(this.exp);
                }
            }
        }
    }
    draw(ctx, cam) {
        ctx.fillStyle = this.color; ctx.beginPath(); 
        if(this.type === 'bomb' || this.type === 'companion') { ctx.arc(this.x-cam.x, this.y-cam.y, this.radius, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle= this.type==='bomb'?'red':'#fff'; ctx.stroke(); }
        else if(this.type === 'chest') { ctx.fillRect(this.x-cam.x-this.radius, this.y-cam.y-this.radius*0.8, this.radius*2, this.radius*1.6); }
        else { ctx.arc(this.x-cam.x, this.y-cam.y, this.radius, 0, Math.PI*2); ctx.fill(); }
    }
}

class FloatText {
    constructor(x, y, text, color='#fff') { this.x = x; this.y = y; this.text = text; this.life = 0.8; this.color = color; this.markedForDeath = false; }
    update(dt) { this.y -= 30 * dt; this.life -= dt; if(this.life <= 0) this.markedForDeath = true; }
}

/**
 * 模組 4: 系統輸入與主迴圈
 */
const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if(e.key === 'escape' && gameState.isRunning) togglePause(); });
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let joyActive = false, joyCenter = {x: 0, y: 0};
UI.joyBase.addEventListener('touchstart', e => { e.preventDefault(); joyActive = true; let rect = UI.joyBase.getBoundingClientRect(); joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 }; handleJoy(e.touches[0]); }, {passive:false});
UI.joyBase.addEventListener('touchmove', e => { e.preventDefault(); if(joyActive) handleJoy(e.touches[0]); }, {passive:false});
window.addEventListener('touchend', () => { joyActive = false; input.x = 0; input.y = 0; UI.joyStick.style.transform = `translate(0px, 0px)`; });

function handleJoy(t) {
    let dx = t.clientX - joyCenter.x; let dy = t.clientY - joyCenter.y; let len = Math.hypot(dx, dy); let maxDist = 40;
    if(len > maxDist) { dx = (dx/len)*maxDist; dy = (dy/len)*maxDist; }
    UI.joyStick.style.transform = `translate(${dx}px, ${dy}px)`; input.x = dx / maxDist; input.y = dy / maxDist;
}

function toggleAuto() {
    gameState.isAutoPilot = !gameState.isAutoPilot;
    if (gameState.isAutoPilot) UI.autoBtn.classList.add('auto-active'); else UI.autoBtn.classList.remove('auto-active');
}

function startGame(timeLimit) {
    gameState.maxTime = timeLimit; gameState.spawns = {};
    sessionLoot = { stones: 0, cores: 0, irons: 0, revives: metaData.revives || 0 }; 
    UI.startModal.style.display = 'none'; UI.layer.style.display = 'block';
    
    player = new Player();
    companions = [];
    if (metaData.apprenticeActive) companions.push(new Companion(player.x, player.y, true));

    gameState.lastTime = performance.now(); gameState.isRunning = true;
    requestAnimationFrame(update);
}

function update() {
    if(!gameState.isRunning) return;
    let now = performance.now(); let dt = (now - gameState.lastTime) / 1000; if(dt > 0.1) dt = 0.1; 
    gameState.lastTime = now; gameState.time += dt;

    if (!gameState.isAutoPilot) {
        if(keys['w'] || keys['arrowup']) input.y = -1; else if(keys['s'] || keys['arrowdown']) input.y = 1; else input.y = 0;
        if(keys['a'] || keys['arrowleft']) input.x = -1; else if(keys['d'] || keys['arrowright']) input.x = 1; else input.x = 0;
    }

    player.update(dt);
    companions.forEach(c => c.update(dt)); companions = companions.filter(c => !c.markedForDeath);
    
    spawnerTimer += dt;
    let pct = gameState.time / gameState.maxTime;
    let spawnRate = Math.max(0.2, 1.0 - (pct * 0.8)); 
    let r = Math.max(canvas.width, canvas.height) / 2 + 50; 

    const spawnEvent = (id, type) => {
        if(!gameState.spawns[id]) { gameState.spawns[id] = true; let ang = Math.random() * Math.PI * 2; enemies.push(new Enemy(player.x + Math.cos(ang)*r, player.y + Math.sin(ang)*r, type)); }
    };

    if (pct >= 1.0) spawnEvent('tian', 'boss_tian'); 
    else if (pct >= 0.9) spawnEvent('boss2', 'boss');
    else if (pct >= 0.6) spawnEvent('elite2', 'elite_blood');
    else if (pct >= 0.4) spawnEvent('boss1', 'boss');
    else if (pct >= 0.2) spawnEvent('elite1', 'elite_tree');
    
    if (spawnerTimer > spawnRate && enemies.length < 250 && pct < 1.0) {
        spawnerTimer = 0; let ang = Math.random() * Math.PI * 2; enemies.push(new Enemy(player.x + Math.cos(ang)*r, player.y + Math.sin(ang)*r, 'normal'));
    }

    projectiles.forEach(p => p.update(dt)); projectiles = projectiles.filter(p => !p.markedForDeath);
    enemyProjectiles.forEach(p => p.update(dt)); enemyProjectiles = enemyProjectiles.filter(p => !p.markedForDeath);
    aoeEffects.forEach(a => a.update(dt)); aoeEffects = aoeEffects.filter(a => !a.markedForDeath);
    enemies.forEach(e => e.update(dt)); enemies = enemies.filter(e => !e.markedForDeath);
    drops.forEach(d => d.update(dt)); drops = drops.filter(d => !d.markedForDeath);
    floatTexts.forEach(f => f.update(dt)); floatTexts = floatTexts.filter(f => !f.markedForDeath);

    let rem = Math.max(0, gameState.maxTime - gameState.time);
    let mins = Math.floor(rem / 60); let secs = Math.floor(rem % 60);
    UI.timer.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    UI.stats.innerHTML = `境界: 練氣 ${player.level} 層<br>靈石: ${sessionLoot.stones} | 妖丹: ${sessionLoot.cores} | 玄鐵: ${sessionLoot.irons}<br>擊殺: ${gameState.kills}<br>氣血: ${Math.floor(player.hp)}/${player.maxHp}`;

    draw(); requestAnimationFrame(update);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#222'; ctx.lineWidth = 2; let gridSize = 100;
    let ox = -(gameState.camera.x % gridSize); let oy = -(gameState.camera.y % gridSize);
    ctx.beginPath();
    for(let x = ox; x < canvas.width; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
    for(let y = oy; y < canvas.height; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); }
    ctx.stroke();

    const worldToScreen = (obj) => ({ x: obj.x - gameState.camera.x, y: obj.y - gameState.camera.y });

    drops.forEach(d => d.draw(ctx, gameState.camera));
    companions.forEach(c => c.draw(ctx, gameState.camera));

    if(player && player.hp > 0) {
        let pPos = worldToScreen(player);
        ctx.fillStyle = '#3498db'; ctx.beginPath(); ctx.arc(pPos.x, pPos.y, player.radius, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'red'; ctx.fillRect(pPos.x - 15, pPos.y + 20, 30, 4);
        ctx.fillStyle = '#2ecc71'; ctx.fillRect(pPos.x - 15, pPos.y + 20, 30 * (Math.max(0, player.hp)/player.maxHp), 4);
    }

    enemies.forEach(e => {
        let pos = worldToScreen(e); ctx.fillStyle = e.color;
        ctx.beginPath(); ctx.arc(pos.x, pos.y, e.radius, 0, Math.PI*2); ctx.fill();
        if(e.hp < e.maxHp) {
            ctx.fillStyle = 'red'; ctx.fillRect(pos.x - 12, pos.y - e.radius - 8, 24, 3);
            ctx.fillStyle = '#2ecc71'; ctx.fillRect(pos.x - 12, pos.y - e.radius - 8, 24 * (e.hp/e.maxHp), 3);
        }
        if(e.status.freeze > 0) { ctx.fillStyle='rgba(116,185,255,0.5)'; ctx.beginPath(); ctx.arc(pos.x, pos.y, e.radius+2, 0, Math.PI*2); ctx.fill(); }
    });

    projectiles.forEach(p => p.draw(ctx, gameState.camera));
    enemyProjectiles.forEach(p => p.draw(ctx, gameState.camera));
    aoeEffects.forEach(a => a.draw(ctx, gameState.camera));

    ctx.font = "bold 14px Arial"; ctx.textAlign = "center";
    floatTexts.forEach(f => {
        let pos = worldToScreen(f); ctx.fillStyle = f.color;
        ctx.globalAlpha = Math.min(1, f.life * 2); ctx.fillText(f.text, pos.x, pos.y); ctx.globalAlpha = 1.0;
    });
}

/**
 * 模組 5: UI 與經濟養成系統
 */
function takePlayerDamage(dmg) {
    player.hp -= dmg;
    UI.dmgOverlay.style.opacity = 1; setTimeout(() => UI.dmgOverlay.style.opacity = 0, 150);
    if(player.hp <= 0) {
        if(sessionLoot.revives > 0) {
            sessionLoot.revives--; player.hp = player.maxHp;
            floatTexts.push(new FloatText(player.x, player.y, "九轉還魂!", '#f1c40f'));
            enemies.forEach(e => { if(Math.hypot(e.x-player.x, e.y-player.y) < 300) e.takeDamage(9999); }); 
        } else gameOver();
    }
}

function triggerLevelUp() {
    gameState.isRunning = false; UI.levelUpModal.style.display = 'block';
    const basePool = [
        { name: '清風劍訣', desc: '提升基礎劍氣傷害與頻率', action: () => upgradeWeapon('清風劍氣', 'projectile', 15, 1.0, 'normal', 1) },
        { name: '吐納法', desc: '回復 50 氣血並提升上限', action: () => { player.maxHp += 20; player.hp = Math.min(player.hp+50, player.maxHp); } },
        { name: '神行步', desc: '提升移動速度 15%', action: () => player.speed *= 1.15 },
        { name: '八卦劍陣', desc: '周圍大範圍陣法攻擊', action: () => upgradeWeapon('八卦劍陣', 'aoe', 20, 3.0, 'normal', 1, 120) },
        { name: '三昧真火', desc: '發射可點燃敵人的火球', action: () => upgradeWeapon('三昧真火', 'projectile', 25, 1.5, 'fire', 2) },
        { name: '寒冰飛劍', desc: '凍結並減緩敵人速度', action: () => upgradeWeapon('寒冰飛劍', 'projectile', 10, 1.2, 'ice', 1) }
    ];
    let options = basePool.sort(() => 0.5 - Math.random()).slice(0, 4); 
    UI.optionsContainer.innerHTML = '';
    options.forEach(opt => {
        let isHigh = Math.random() < 0.2 && !opt.name.includes('法') && !opt.name.includes('步');
        let finalName = opt.name, finalDesc = opt.desc, actionWrapper = opt.action;
        if (isHigh) {
            let af = [{prefix:'[極速]', d: ' (減CD)', mod: w=>{w.cooldown*=0.5;}}, {prefix:'[天道]', d: ' (雙倍傷)', mod: w=>{w.damage*=2;}}][Math.floor(Math.random()*2)];
            finalName = af.prefix + finalName; finalDesc += af.d;
            actionWrapper = () => { opt.action(); let w = player.weapons.find(w=>w.name===opt.name); if(w) af.mod(w); };
        }
        let div = document.createElement('div'); div.className = isHigh ? 'card affix-high' : 'card';
        div.innerHTML = `<div class="card-title">${finalName}</div><div style="font-size:12px; margin-top:5px; color:#aaa;">${finalDesc}</div>`;
        div.onclick = () => { actionWrapper(); checkSynergies(); UI.levelUpModal.style.display = 'none'; gameState.lastTime = performance.now(); gameState.isRunning = true; requestAnimationFrame(update); };
        UI.optionsContainer.appendChild(div);
    });
}

function upgradeWeapon(name, type, dmg, cd, el, pierce, radius=0) {
    let w = player.weapons.find(w=>w.name===name);
    if(w) w.level++; else player.weapons.push({name, type, level:1, damage: dmg, cooldown: cd, timer:0, element: el, pierce, radius});
}
function checkSynergies() {
    let syns = [{ reqW: '清風劍氣', newW: {name: '萬劍歸宗', type: 'projectile', level: 1, damage: 30, cooldown: 0.3, timer:0, element: 'normal', pierce: 99} }];
    syns.forEach(s => {
        let w = player.weapons.find(w => w.name === s.reqW);
        if(w && w.level >= 3) { player.weapons = player.weapons.filter(x => x.name !== s.reqW); player.weapons.push(s.newW); floatTexts.push(new FloatText(player.x, player.y, "神功進化: " + s.newW.name, '#f1c40f')); }
    });
}

function triggerChest() {
    gameState.isRunning = false; UI.chestModal.style.display = 'block';
    let rewards = ["獲得 5 顆妖丹與 50 靈石！", "獲得 20 個玄鐵！", "所有武器等級 +1！"];
    let rIdx = Math.floor(Math.random() * rewards.length);
    document.getElementById('chest-reward').innerText = rewards[rIdx];
    if (rIdx === 0) { sessionLoot.cores += 5; sessionLoot.stones += 50; } else if (rIdx === 1) sessionLoot.irons += 20; else player.weapons.forEach(w => w.level++);
}
function closeChest() { UI.chestModal.style.display = 'none'; gameState.lastTime = performance.now(); gameState.isRunning = true; requestAnimationFrame(update); }

function togglePause() {
    if(UI.gameOverModal.style.display==='block' || UI.levelUpModal.style.display==='block' || UI.startModal.style.display==='block' || UI.chestModal.style.display==='block' || UI.hubModal.style.display==='block') return;
    if(gameState.isRunning) { gameState.isRunning = false; UI.pauseModal.style.display = 'block'; } 
    else { UI.pauseModal.style.display = 'none'; gameState.lastTime = performance.now(); gameState.isRunning = true; requestAnimationFrame(update); }
}

function gameOver() {
    if(!gameState.isRunning) return; gameState.isRunning = false; UI.gameOverModal.style.display = 'block';
    metaData.spiritStones += sessionLoot.stones; metaData.cores += sessionLoot.cores; metaData.irons += sessionLoot.irons;
    // 結算熟練度
    player.weapons.forEach(w => { metaData.mastery[w.name] = (metaData.mastery[w.name] || 0) + w.level; });
    sessionLoot = {stones:0, cores:0, irons:0, revives:0}; saveMeta();
    let mins = Math.floor(gameState.time / 60); let secs = Math.floor(gameState.time % 60);
    document.getElementById('go-stats').innerHTML = `存活時間: ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

    UI.hubModal.style.display = 'none';
    if(hubReturnTo==='start') { document.getElementById('start-stones').innerText = metaData.spiritStones; document.getElementById('start-cores').innerText = metaData.cores; document.getElementById('start-irons').innerText = metaData.irons; UI.startModal.style.display = 'block'; }
    else if(hubReturnTo==='pause') UI.pauseModal.style.display = 'block'; else UI.gameOverModal.style.display = 'block';
}
function switchHubTab(tab) {
    currentHubTab = tab; document.querySelectorAll('.nav-tab').forEach(e => e.classList.remove('active')); document.getElementById('tab-'+tab).classList.add('active');
    document.getElementById('hub-stones').innerText = metaData.spiritStones; document.getElementById('hub-cores').innerText = metaData.cores; document.getElementById('hub-irons').innerText = metaData.irons;
    let html = '';
    if (tab === 'shop') {
        shopCatalog.forEach(item => {
            let current = getBoughtCount(item.id); let btnHTML = current >= item.max ? `<span style="color:#2ecc71">已達上限</span>` : `可購買 (${current}/${item.max})`;
            html += `<div class="card" onclick="buyShopItem('${item.id}', ${item.cost}, ${item.max})" style="display:flex; justify-content:space-between; align-items:center;">
                <div><div class="card-title">${item.name}</div><div style="font-size:12px; color:#aaa;">${item.desc}</div></div>
                <div style="text-align:right;"><div style="color:#f1c40f; font-weight:bold;">${item.cost} 靈石</div><div style="font-size:12px; color:#777;">${btnHTML}</div></div></div>`;
        });
    } else if (tab === 'craft') {
        craftCatalog.forEach(item => {
            let isOwned = metaData.equipment[item.type] === item.id;
            let btnHTML = isOwned ? `<span style="color:#2ecc71">已裝備</span>` : `<span style="color:#c9a562">點擊打造</span>`;
            html += `<div class="card" onclick="craftItem('${item.id}', '${item.type}', ${item.costCores}, ${item.costIrons})" style="display:flex; justify-content:space-between; align-items:center;">
                <div><div class="card-title">${item.name}</div><div style="font-size:12px; color:#aaa;">${item.desc}</div></div>
                <div style="text-align:right;"><div style="color:#e74c3c; font-weight:bold;">${item.costCores}妖丹 / ${item.costIrons}玄鐵</div><div style="font-size:12px;">${btnHTML}</div></div></div>`;
        });
    } else if (tab === 'mastery') {
        let keys = Object.keys(metaData.mastery);
        if(keys.length === 0) html = `<div style="text-align:center; color:#777; padding:20px;">尚無武學熟練度<br>請先完成一次修行</div>`;
        keys.forEach(k => {
            let lvl = metaData.mastery[k];
            html += `<div class="card">
                <div class="card-title">${k} (Lv.${lvl})</div>
                <div style="font-size:12px; color:#2ecc71;">傷害 +${lvl*2}% / 冷卻 -${Math.floor((1-Math.pow(0.99, lvl))*100)}%</div></div>`;
        });
    }
    document.getElementById('hub-content').innerHTML = html;
}
function getBoughtCount(id) { if(id==='hp') return metaData.hpBonus; if(id==='atk') return metaData.atkBonus; if(id==='apprentice') return metaData.apprenticeActive?1:0; if(id==='revive') return metaData.revives; return 0; }
function buyShopItem(id, cost, max) {
    if (getBoughtCount(id) >= max) { alert("已達購買上限！"); return; }
    if(metaData.spiritStones >= cost) {
        metaData.spiritStones -= cost;
        if(id==='hp') metaData.hpBonus++; else if(id==='atk') metaData.atkBonus++; else if(id==='apprentice') metaData.apprenticeActive = true; else if(id==='revive') metaData.revives++;
        saveMeta(); switchHubTab('shop');
    } else alert("靈石不足！");
}
function craftItem(id, type, costCores, costIrons) {
    if (metaData.equipment[type] === id) { alert("已裝備此神兵！"); return; }
    if (metaData.cores >= costCores && metaData.irons >= costIrons) {
        metaData.cores -= costCores; metaData.irons -= costIrons;
        metaData.equipment[type] = id;
        saveMeta(); switchHubTab('craft'); alert("打造並裝備成功！");
    } else alert("材料不足！");
}
function saveMeta() { localStorage.setItem('guigu_save_v3', JSON.stringify(metaData)); }

window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; VisualEngine3D.resize(); });
draw();
</script>
</body>
</html>
