<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>鬼谷倖存者 Demo-008 (天命匯聚版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100vw; height: 100dvh; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', sans-serif; touch-action: none; user-select: none; }
        #bg-3d-canvas { position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none; }
        #gameCanvas { position: absolute; top: 0; left: 0; z-index: 2; background: transparent; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 10; }
        .bar-container { position: absolute; top: env(safe-area-inset-top, 10px); left: 10px; width: calc(100% - 150px); height: 20px; background: #333; border: 2px solid #555; border-radius: 10px; overflow: hidden; }
        #exp-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%); transition: width 0.2s; }
        .stats { position: absolute; top: calc(env(safe-area-inset-top, 10px) + 30px); left: 15px; color: white; text-shadow: 1px 1px 2px black; font-size: 14px; line-height: 1.6; }
        #timer { position: absolute; top: calc(env(safe-area-inset-top, 10px) + 30px); right: 15px; color: white; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px black; }
        #fps-monitor { position: absolute; top: env(safe-area-inset-top, 10px); right: 150px; color: #f1c40f; font-size: 12px; font-weight: bold; }
        
        .btn { pointer-events: auto; background: rgba(20,20,20,0.85); color: #c9a562; border: 1px solid #c9a562; padding: 8px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; transition: 0.2s; display: inline-block; text-shadow: 1px 1px 2px black; }
        .btn:hover { background: #c9a562; color: #000; box-shadow: 0 0 10px #c9a562; }
        #pause-btn { position: absolute; top: env(safe-area-inset-top, 5px); right: 10px; z-index: 50; }
        #auto-btn { position: absolute; top: env(safe-area-inset-top, 5px); right: 80px; z-index: 50; border-color: #3498db; color: #3498db; }
        .auto-active { background: #3498db !important; color: white !important; }

        #joystick-zone { position: absolute; bottom: 10%; left: 10%; width: 120px; height: 120px; pointer-events: auto; display: none; }
        #joystick-base { width: 100%; height: 100%; background: rgba(255, 255, 255, 0.15); border-radius: 50%; position: relative; border: 1px solid rgba(255,255,255,0.3); }
        #joystick-stick { width: 40px; height: 40px; background: rgba(255, 255, 255, 0.6); border-radius: 50%; position: absolute; top: 40px; left: 40px; }
        
        .modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 15, 15, 0.95); border: 2px solid #c9a562; padding: 25px; border-radius: 12px; color: white; text-align: center; pointer-events: auto; width: 85%; max-width: 600px; z-index: 100; max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
        .card { background: #2a2a2a; border: 1px solid #555; padding: 12px; margin: 8px 0; border-radius: 8px; cursor: pointer; transition: 0.2s; position: relative; text-align: left;}
        .card:hover { border-color: #c9a562; background: #3a3a3a; transform: translateY(-2px); }
        .card-title { font-weight: bold; font-size: 16px; color: #f1c40f; margin-bottom: 4px; }
        .affix-high { border-color: #e74c3c; box-shadow: inset 0 0 15px rgba(231,76,60,0.15); }
        .affix-high .card-title { color: #ff7675; }
        .mode-btn { width: 100%; box-sizing: border-box; margin: 6px 0; font-size: 16px; padding: 12px; }
        
        #damage-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(255,0,0,0.3); pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 40;}
        @media (hover: none) and (pointer: coarse) { #joystick-zone { display: block; } }

        #avatar-creation { background: rgba(0,0,0,0.4); border: 1px solid #555; border-radius: 8px; padding: 10px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        #avatar-preview-box { width: 80px; height: 80px; background: #222; border: 2px solid #c9a562; border-radius: 50%; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px rgba(201,165,98,0.3); }
        #avatar-preview-canvas { width: 100%; height: 100%; image-rendering: pixelated; }
        .avatar-controls { flex: 1; margin-left: 15px; text-align: left; }
        .ctrl-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .ctrl-btn { background: #333; color: #fff; border: 1px solid #777; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-weight: bold; line-height: 20px; }
        .ctrl-btn:hover { background: #c9a562; color: #000; }
        .ctrl-label { font-size: 14px; color: #aaa; width: 40px; text-align: center; }
    </style>
</head>
<body>
    <canvas id="bg-3d-canvas"></canvas>
    <canvas id="gameCanvas"></canvas>
    <div id="damage-overlay"></div>
    
    <div id="ui-layer">
        <div class="bar-container"><div id="exp-bar"></div></div>
        <div id="fps-monitor">FPS: 60</div>
        <button id="auto-btn" class="btn" onclick="toggleAuto()">🤖 託管</button>
        <button id="pause-btn" class="btn" onclick="togglePause()">暫停</button>
        <div class="stats" id="stats-display"></div>
        <div id="timer">00:00</div>
        <div id="joystick-zone"><div id="joystick-base"><div id="joystick-stick"></div></div></div>
    </div>

    <!-- 首頁與創角系統 -->
    <div id="start-modal" class="modal" style="display: block; max-width: 600px; padding: 0;">
        <div id="ui-step-1" style="padding: 25px;">
            <h1 style="color: #c9a562; font-size: 32px; letter-spacing: 2px;">鬼谷倖存者</h1>
            <div style="background: rgba(0,0,0,0.5); border-left: 4px solid #c9a562; padding: 15px; text-align: left; line-height: 1.8; color: #ccc; margin-bottom: 20px;">
                「天地靈氣衰竭，八荒妖獸肆虐。<br>
                傳聞唯有身負大氣運者，方能逆天改命，踏足登仙之路。<br>
                道友，您的傳奇，便從這十萬大山開始……」
            </div>
            <div id="avatar-creation">
                <div id="avatar-preview-box"><canvas id="avatar-preview-canvas" width="64" height="64"></canvas></div>
                <div class="avatar-controls">
                    <div class="ctrl-row"><span class="ctrl-label">髮型</span><div><button class="ctrl-btn" onclick="changeAvatar('hair', -1)">◀</button> <span id="lbl-hair" style="display:inline-block; width:20px; text-align:center;">1</span> <button class="ctrl-btn" onclick="changeAvatar('hair', 1)">▶</button></div></div>
                    <div class="ctrl-row"><span class="ctrl-label">面容</span><div><button class="ctrl-btn" onclick="changeAvatar('face', -1)">◀</button> <span id="lbl-face" style="display:inline-block; width:20px; text-align:center;">1</span> <button class="ctrl-btn" onclick="changeAvatar('face', 1)">▶</button></div></div>
                    <div class="ctrl-row"><span class="ctrl-label">道袍</span><div><button class="ctrl-btn" onclick="changeAvatar('clothes', -1)">◀</button> <span id="lbl-clothes" style="display:inline-block; width:20px; text-align:center;">1</span> <button class="ctrl-btn" onclick="changeAvatar('clothes', 1)">▶</button></div></div>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn" style="flex:2; font-size: 16px;" onclick="switchStartStep(2)">凝聚神魂 (下一步)</button>
                <button class="btn" style="flex:1; background: #8e44ad; color: #fff; font-size: 14px;" onclick="openHub('start', 'shop')">🛕 進入洞府</button>
            </div>
        </div>
        <div id="ui-step-2" style="display: none; padding: 25px;">
            <h2 style="color: #c9a562; margin-top: 0;">天道輪迴</h2>
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <div style="width: 45%; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 5px; text-align: left;">
                    <h3 style="margin:0 0 10px 0; color: #3498db; border-bottom: 1px solid #555;">基礎屬性</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 14px;">
                        <div>體力: <span id="roll-hp" style="color:#2ecc71">100</span></div><div>靈氣: <span id="roll-mp" style="color:#3498db">50</span></div>
                        <div>攻擊: <span id="roll-atk" style="color:#e74c3c">10</span></div><div>防禦: <span id="roll-def" style="color:#f1c40f">5</span></div>
                        <div>悟性: <span id="roll-int" style="color:#9b59b6">80</span></div><div>幸運: <span id="roll-luck" style="color:#f39c12">80</span></div>
                    </div>
                </div>
                <div style="width: 50%; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 5px; text-align: left;">
                    <h3 style="margin:0 0 10px 0; color: #ff4757; border-bottom: 1px solid #555;">先天氣運</h3>
                    <div id="roll-traits" style="font-size: 14px; min-height: 80px;"></div>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn" style="flex:1; background: #c9a562; color: #000;" onclick="rollStats()">🎲 逆天改命 (Roll)</button>
                <button class="btn" style="flex:1;" onclick="applyStatsAndNext()">確定命格</button>
            </div>
        </div>
        <div id="ui-step-3" style="display: none; padding: 25px;">
            <h2 style="color: #c9a562; margin-top: 0;">拜入宗門</h2>
            <div id="sect-dialogue" style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 5px; text-align: left; min-height: 80px; margin-bottom: 15px; font-style: italic; color: #aaa;">
                「天地蒼茫，道法萬千。你欲執劍斬妖，還是馭火焚天？」
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn mode-btn" onclick="selectSectDialogue('sword')" onmouseover="hoverSect('sword')" style="border-color:#3498db; color:#3498db;">【青雲劍宗】專修飛劍，攻速極快</button>
                <button class="btn mode-btn" onclick="selectSectDialogue('magic')" onmouseover="hoverSect('magic')" style="border-color:#e74c3c; color:#e74c3c;">【焚天谷】專修五行火術，大範圍灼燒</button>
                <button class="btn mode-btn" onclick="selectSectDialogue('body')"  onmouseover="hoverSect('body')"  style="border-color:#2ecc71; color:#2ecc71;">【極道體宗】專修肉身防禦，極致生存</button>
            </div>
            <div id="time-selection-new" style="display: none; margin-top: 20px; border-top: 1px solid #555; padding-top: 15px;">
                <div style="display: flex; gap: 10px;">
                    <button class="btn" style="flex:1;" onclick="confirmStart(300)">切磋 (5分)</button>
                    <button class="btn" style="flex:1;" onclick="confirmStart(600)">歷練 (10分)</button>
                    <button class="btn" style="flex:1; border-color:#e74c3c; color:#e74c3c" onclick="confirmStart(900)">生死 (15分)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 局外 HUB (洞府/宗門) 彈窗 -->
    <div id="hub-modal" class="modal" style="display:none; max-width: 650px; padding: 20px;">
        <h2 style="color: #c9a562; margin-top: 0; letter-spacing: 2px;">🛕 八荒宗門與洞府</h2>
        <div style="background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 5px; margin-bottom: 15px; display: flex; justify-content: space-around; font-size: 14px; border: 1px solid #555;">
            <span>💎 靈石: <span id="hub-stones" style="color:#00f2fe">0</span></span>
            <span>🔴 妖丹: <span id="hub-cores" style="color:#e74c3c">0</span></span>
            <span>⛓️ 玄鐵: <span id="hub-irons" style="color:#95a5a6">0</span></span>
        </div>
        <div style="display: flex; border-bottom: 1px solid #555; margin-bottom: 15px;">
            <div id="tab-shop" class="nav-tab active" onclick="switchHubTab('shop')" style="flex:1; padding:10px; cursor:pointer; color:#aaa; background:#222; border:1px solid #555; border-bottom:none;">聚寶閣</div>
            <div id="tab-materials" class="nav-tab" onclick="switchHubTab('materials')" style="flex:1; padding:10px; cursor:pointer; color:#aaa; background:#222; border:1px solid #555; border-bottom:none;">天材地寶</div>
            <div id="tab-mastery" class="nav-tab" onclick="switchHubTab('mastery')" style="flex:1; padding:10px; cursor:pointer; color:#aaa; background:#222; border:1px solid #555; border-bottom:none;">藏經閣</div>
            <div id="tab-cave" class="nav-tab" onclick="switchHubTab('cave')" style="flex:1; padding:10px; cursor:pointer; color:#aaa; background:#222; border:1px solid #555; border-bottom:none;">洞府突破</div>
        </div>
        <div id="hub-content" style="text-align: left; max-height: 350px; overflow-y: auto; padding-right: 5px; margin-bottom: 15px;"></div>
        <button class="btn" onclick="closeHub()" style="width: 100%;">返回山門</button>
    </div>

    <!-- 遊戲中彈窗 -->
    <div id="levelup-modal" class="modal"><h2 style="color: #c9a562;">境界突破</h2><div id="upgrade-options"></div></div>
    <div id="chest-modal" class="modal"><h2 style="color:#f1c40f;">機緣降臨！</h2><div id="chest-reward" style="margin:20px 0; font-size:18px;"></div><button class="btn" onclick="closeChest()">收下</button></div>
    <div id="gameover-modal" class="modal">
        <h2 style="color: #e74c3c; font-size: 32px;">道死身消</h2><p id="go-stats"></p>
        <button class="btn" onclick="openHub('gameover', 'shop')" style="margin-right:10px; background:#8e44ad; color:#fff;">進入洞府修養</button>
        <button class="btn" onclick="location.reload()">輪迴重修 (首頁)</button>
    </div>
    <div id="pause-modal" class="modal">
        <h2 style="color: #c9a562;">修行暫停</h2>
        <button class="btn mode-btn" onclick="togglePause()">繼續修行</button>
        <button class="btn mode-btn" onclick="openHub('pause', 'shop')">返回洞府</button>
        <button class="btn mode-btn" onclick="location.reload()" style="border-color: #e74c3c; color: #e74c3c;">放棄本次輪迴</button>
    </div>

<script>
/** ==========================================
 *  一、基礎狀態、資源與存檔 (GGCORE & SAVE)
 *  ========================================== */
window.GG = window.GG || {};
if (!window.GG.config) window.GG.config = Object.freeze({ version: 'Demo-008', fps_target: 60, save_schema: 1 });

window.GG.state = window.GG.state || {
    player: { level: 1, realm: '練氣期', hp_current: 100, hp_max: 100, mp_current: 50, mp_max: 50, atk: 10, def: 5, luck: 80, int: 80, cha: 100, exp: 0, exp_next: 150, traits: [] },
    inventory: { spirit_stones: 0, cores: 0, irons: 0, items: {} },
    appearance: { face: 1, hair: 1, clothes: 1 },
    mastery: {}
};
window.GG.runtime = window.GG.runtime || { paused: false, last_frame_time: null };

// 雙槽存檔與向後相容擴充
window.GG.save = (() => {
    const KEYS = ['guigu.save.v8'];
    function save(stateObj) { try { localStorage.setItem(KEYS[0], JSON.stringify(stateObj)); return true; } catch(e) { return false; } }
    function load() { try { let raw = localStorage.getItem(KEYS[0]); return raw ? JSON.parse(raw) : null; } catch(e) { return null; } }
    return { save, load };
})();

// 初始化載入並確保資料結構相容
let loadedState = window.GG.save.load();
if (loadedState) {
    window.GG.state = loadedState;
    if (!window.GG.state.inventory.items) window.GG.state.inventory.items = {};
    if (!window.GG.state.mastery) window.GG.state.mastery = {};
}

// 資源管理系統
window.GG.res = (() => {
    const PATHS = {
        'stones': { get: s => s.inventory.spirit_stones, set: (s,v) => s.inventory.spirit_stones = Math.max(0,v) },
        'cores':  { get: s => s.inventory.cores, set: (s,v) => s.inventory.cores = Math.max(0,v) },
        'irons':  { get: s => s.inventory.irons, set: (s,v) => s.inventory.irons = Math.max(0,v) },
        'hp':     { get: s => s.player.hp_current, set: (s,v) => s.player.hp_current = Math.max(0, Math.min(v, s.player.hp_max)) }
    };
    function change(path, delta) {
        if(!PATHS[path] || !Number.isFinite(delta)) return false;
        PATHS[path].set(window.GG.state, PATHS[path].get(window.GG.state) + delta);
        window.GG.save.save(window.GG.state);
        return true;
    }
    return { add: (p, n) => change(p, Math.abs(n)), sub: (p, n) => change(p, -Math.abs(n)) };
})();

/** ==========================================
 *  二、鬼谷八荒正統知識庫對齊 (NotebookLM RAG)
 *  ========================================== */
window.GG.traits = [
    { name: "鬼谷外門", desc: "攻擊力+10，悟性+30，魅力+100", color: "#ff4757", apply: (p) => { p.atk+=10; p.int+=30; p.cha+=100; } },
    { name: "人族聖體", desc: "攻擊力+8，體力上限+150，幸運+10", color: "#ff4757", apply: (p) => { p.atk+=8; p.hp_max+=150; p.hp_current+=150; p.luck+=10; } },
    { name: "武聖轉世", desc: "攻擊力+10，防禦力+5，悟性+20", color: "#ffa502", apply: (p) => { p.atk+=10; p.def+=5; p.int+=20; } },
    { name: "天命之子", desc: "幸運+50，魅力+200", color: "#ffa502", apply: (p) => { p.luck+=50; p.cha+=200; } }
];

window.GG.materials = {
    breakthrough: ["葬沙骨", "朝夕露", "暖玉", "夕顏", "鬼哭藤", "北冥幽魄", "鳳凰果", "九彩鈴蘭", "太陰真火"],
    pills: ["一品化瘀丹", "聚氣丹", "洗髓丸"]
};

// 波次難度引擎
window.GG.wave = { 
    getDifficulty: (t, mt) => {
        let pct = Math.min(1.0, t / mt);
        let phaseMulti = 1 + (pct * 2.5); // 階梯式成長
        return { hpMulti: phaseMulti * (1 + pct * 3), dmgMulti: phaseMulti * (1 + pct * 1.5) };
    }, 
    tick: (dt, t, mt, count) => count >= 150 ? null : Math.max(0.08, 1.2 - (t/mt)*0.9) 
};

/** ==========================================
 *  三、2.5D 美術與離線渲染 (Art & Canvas GL)
 *  ========================================== */
window.GG.art = {
    max: { hair: 3, face: 2, clothes: 3 },
    hair: [
        (ctx) => { ctx.fillStyle='#d35400'; ctx.beginPath(); ctx.arc(28,20,1,0,Math.PI*2); ctx.arc(36,20,1,0,Math.PI*2); ctx.fill(); },
        (ctx) => { ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(32, 26, 15, Math.PI, 0); ctx.moveTo(17, 26); ctx.lineTo(17, 36); ctx.lineTo(23, 26); ctx.moveTo(47, 26); ctx.lineTo(47, 36); ctx.lineTo(41, 26); ctx.fill(); ctx.beginPath(); ctx.arc(32, 12, 6, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#c9a562'; ctx.fillRect(28, 14, 8, 2); },
        (ctx) => { ctx.fillStyle = '#2c3e50'; ctx.beginPath(); ctx.moveTo(15, 30); ctx.quadraticCurveTo(32, 5, 49, 30); ctx.lineTo(55, 45); ctx.lineTo(42, 25); ctx.lineTo(32, 22); ctx.lineTo(22, 25); ctx.lineTo(9, 45); ctx.fill(); },
        (ctx) => { ctx.fillStyle = '#ecf0f1'; ctx.beginPath(); ctx.arc(32, 26, 14, Math.PI, 0); ctx.fill(); ctx.fillRect(18, 26, 28, 20); }
    ],
    face: [
        (ctx) => { ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(26,30,2,0,Math.PI*2); ctx.arc(38,30,2,0,Math.PI*2); ctx.fill(); },
        (ctx) => { ctx.strokeStyle='#111'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(22,26); ctx.lineTo(28,28); ctx.stroke(); ctx.beginPath(); ctx.moveTo(42,26); ctx.lineTo(36,28); ctx.stroke(); ctx.fillStyle='#000'; ctx.fillRect(25,30,3,2); ctx.fillRect(36,30,3,2); },
        (ctx) => { ctx.fillStyle='#c0392b'; ctx.beginPath(); ctx.arc(26,30,2.5,0,Math.PI*2); ctx.arc(38,30,2.5,0,Math.PI*2); ctx.fill(); ctx.shadowColor = '#e74c3c'; ctx.shadowBlur = 5; ctx.fill(); ctx.shadowBlur = 0; ctx.strokeStyle='#000'; ctx.beginPath(); ctx.moveTo(30,38); ctx.lineTo(34,38); ctx.stroke(); }
    ],
    clothes: [
        (ctx) => { ctx.fillStyle = '#7f8c8d'; ctx.beginPath(); ctx.moveTo(20,40); ctx.lineTo(44,40); ctx.lineTo(48,64); ctx.lineTo(16,64); ctx.fill(); },
        (ctx) => { ctx.fillStyle = '#ecf0f1'; ctx.beginPath(); ctx.moveTo(20,40); ctx.lineTo(44,40); ctx.lineTo(50,64); ctx.lineTo(14,64); ctx.fill(); ctx.fillStyle = '#2c3e50'; ctx.beginPath(); ctx.moveTo(32,40); ctx.lineTo(44,40); ctx.lineTo(50,64); ctx.lineTo(32,64); ctx.fill(); ctx.strokeStyle = '#f1c40f'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(20,40); ctx.lineTo(32,50); ctx.lineTo(44,40); ctx.stroke(); },
        (ctx) => { let grd = ctx.createLinearGradient(0,40, 0,64); grd.addColorStop(0, '#2980b9'); grd.addColorStop(1, '#8e44ad'); ctx.fillStyle = grd; ctx.beginPath(); ctx.moveTo(18,40); ctx.lineTo(46,40); ctx.lineTo(54,64); ctx.lineTo(10,64); ctx.fill(); ctx.strokeStyle = '#ecf0f1'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(32,40); ctx.lineTo(32,64); ctx.stroke(); },
        (ctx) => { ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.moveTo(16,40); ctx.lineTo(48,40); ctx.lineTo(52,64); ctx.lineTo(12,64); ctx.fill(); ctx.fillStyle = '#f39c12'; ctx.fillRect(22,46,6,10); ctx.fillRect(36,46,6,10); }

window.GG.avatar = (() => {
    let cachedPlayerAvatar = null;
    function generateAvatar(appearance) {
        let offCanvas = document.createElement('canvas'); offCanvas.width = 64; offCanvas.height = 64; let ctx = offCanvas.getContext('2d');
        let clothIdx = appearance.clothes || 0; if(window.GG.art.clothes[clothIdx]) window.GG.art.clothes[clothIdx](ctx);
        ctx.fillStyle = '#f1c27d'; ctx.beginPath(); ctx.arc(32, 30, 12, 0, Math.PI * 2); ctx.fill();
        let faceIdx = appearance.face || 0; if(window.GG.art.face[faceIdx]) window.GG.art.face[faceIdx](ctx);
        let hairIdx = appearance.hair || 0; if(window.GG.art.hair[hairIdx]) window.GG.art.hair[hairIdx](ctx);
        return offCanvas;
    }
    function refreshPlayerPreview() {
        let app = window.GG.state.appearance;
        document.getElementById('lbl-hair').innerText = app.hair; document.getElementById('lbl-face').innerText = app.face; document.getElementById('lbl-clothes').innerText = app.clothes;
        cachedPlayerAvatar = generateAvatar(app);
        let prevCtx = document.getElementById('avatar-preview-canvas').getContext('2d');
        prevCtx.clearRect(0, 0, 64, 64); prevCtx.drawImage(cachedPlayerAvatar, 0, 0);
    }
    return { generateAvatar, refreshPlayerPreview, getPlayerCache: () => cachedPlayerAvatar };
})();
function changeAvatar(part, delta) {
    if(!window.GG.state.appearance) window.GG.state.appearance = { hair:1, face:1, clothes:1 };
    let current = window.GG.state.appearance[part]; let max = window.GG.art.max[part];
    current += delta; if (current > max) current = 0; if (current < 0) current = max;
    window.GG.state.appearance[part] = current;
    window.GG.avatar.refreshPlayerPreview();
}

/** ==========================================
 *  四、遊戲核心實體 (Player, Weapon, Enemy, Drop)
 *  ========================================== */
const SoundManager = {
    ctx: null, enabled: false,
    init: function() { if(this.ctx) return; window.AudioContext = window.AudioContext || window.webkitAudioContext; this.ctx = new AudioContext(); this.enabled = true; },
    playTone: function(freq, type, duration, vol=0.1) {
        if(!this.enabled || !this.ctx) return; let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + duration);
    },
    shoot: function() { this.playTone(600, 'triangle', 0.1, 0.05); }, hit: function() { this.playTone(150, 'square', 0.1, 0.05); }, pickup: function() { this.playTone(1200, 'sine', 0.1, 0.05); }
};

const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
const UI = { layer: document.getElementById('ui-layer'), expBar: document.getElementById('exp-bar'), stats: document.getElementById('stats-display'), timer: document.getElementById('timer'), joyBase: document.getElementById('joystick-base'), joyStick: document.getElementById('joystick-stick') };

let gameState = { isRunning: false, isAutoPilot: false, time: 0, maxTime: 300, camera: { x: 0, y: 0 } };
let player, enemies = [], projectiles = [], drops = [], floatTexts = [], companions = [], aoeEffects = [];
let kbInput = {x: 0, y: 0}, joyInput = {x: 0, y: 0}, aiMomentum = {x: 0, y: 0}, spawnerTimer = 0;
let chosenSect = 'sword';

class Player {
    constructor(sect) {
        this.x = 0; this.y = 0; this.radius = 15;
        let pState = window.GG.state.player;
        this.speed = 160 + (pState.atk * 1.5); this.maxHp = pState.hp_max; this.hp = pState.hp_current; 
        this.pickupRadius = 60 + (pState.int * 1); this.expMulti = 1 + (pState.int * 0.02);
        this.weapons = [];
        
        // 初始武器賦予
        if(sect === 'sword') this.addWeapon('清風劍氣', 'projectile', 15, 1.0, 'normal', 1);
        else if(sect === 'magic') this.addWeapon('三昧真火', 'projectile', 25, 1.5, 'fire', 2);
        else this.addWeapon('玄冰護盾', 'orbit', 10, 0, 'ice', 99, 60);
    }
    addWeapon(name, type, dmg, cd, el, pierce, radius=0) {
        let w = this.weapons.find(x=>x.name===name); 
        if(w) w.level++; else this.weapons.push({name, type, level:1, baseDmg: dmg, baseCd: cd, timer:0, element: el, pierce, radius, angle:0});
    }
    update(dt) {
        // 移動邏輯 (支援託管)
        if (gameState.isAutoPilot) {
            let aiVec = {x: 0, y: 0}; let danger = false;
            enemies.forEach(e => { let dSq = (e.x-this.x)**2 + (e.y-this.y)**2; if (dSq < 22500) { let d = Math.sqrt(dSq); aiVec.x -= (e.x-this.x)/d; aiVec.y -= (e.y-this.y)/d; danger = true; } });
            if (!danger && drops.length > 0) { let dTarget = drops[0]; let dSq = (dTarget.x-this.x)**2 + (dTarget.y-this.y)**2; if(dSq > 0) { let d = Math.sqrt(dSq); aiVec.x += (dTarget.x-this.x)/d; aiVec.y += (dTarget.y-this.y)/d; } }
            let aLenSq = aiVec.x**2 + aiVec.y**2; if(aLenSq > 0) { let aLen = Math.sqrt(aLenSq); aiVec.x /= aLen; aiVec.y /= aLen; }
            aiMomentum.x = aiMomentum.x * 0.85 + aiVec.x * 0.15; aiMomentum.y = aiMomentum.y * 0.85 + aiVec.y * 0.15;
            kbInput.x = aiMomentum.x; kbInput.y = aiMomentum.y; joyInput.x = 0; joyInput.y = 0;
        }

        let ix = Math.abs(kbInput.x) > Math.abs(joyInput.x) ? kbInput.x : joyInput.x; let iy = Math.abs(kbInput.y) > Math.abs(joyInput.y) ? kbInput.y : joyInput.y;
        if(ix !== 0 || iy !== 0) { let lenSq = ix*ix + iy*iy; let len = Math.sqrt(lenSq); this.x += (ix/len)*this.speed*dt; this.y += (iy/len)*this.speed*dt; }
        gameState.camera.x = this.x - canvas.width / 2; gameState.camera.y = this.y - canvas.height / 2;

        // 武器全家桶觸發邏輯
        this.weapons.forEach(w => {
            let masteryLvl = window.GG.state.mastery[w.name] || 0;
            // 戰鬥公平公式：實際傷害受永久攻擊力(atk)、熟練度與等級影響
            let actualDmg = w.baseDmg * (1 + (window.GG.state.player.atk * 0.05)) * (1 + masteryLvl * 0.015) * (1 + (w.level-1)*0.2);
            let actualCd = w.baseCd * Math.pow(0.98, window.GG.state.player.int * 0.1);
            
            if (w.type === 'orbit') {
                w.angle += 3 * dt; let ox = this.x + Math.cos(w.angle) * w.radius; let oy = this.y + Math.sin(w.angle) * w.radius;
                enemies.forEach(e => { if((ox - e.x)**2 + (oy - e.y)**2 < (e.radius + 15)**2) { e.takeDamage(actualDmg * dt * 2, w.name); e.applyElement(w.element); } });
            } else {
                w.timer -= dt;
                if(w.timer <= 0) {
                    if (w.type === 'projectile') {
                        if(enemies.length > 0) {
                            let closest = enemies.reduce((c, e) => { let dSq = (this.x-e.x)**2 + (this.y-e.y)**2; return dSq < c.dSq ? {e: e, dSq: dSq} : c; }, {e: null, dSq: Infinity});
                            if (closest.e && closest.dSq < 360000) {
                                let d = Math.sqrt(closest.dSq);
                                projectiles.push(new Projectile(this.x, this.y, (closest.e.x-this.x)/d, (closest.e.y-this.y)/d, actualDmg, w.name, w.element, w.pierce));
                                SoundManager.shoot(); w.timer = Math.max(0.1, actualCd);
                            }
                        }
                    } else if (w.type === 'aoe') {
                        let r = w.radius + (w.level * 10);
                        aoeEffects.push(new AoeEffect(this.x, this.y, r, w.element));
                        enemies.forEach(e => { if((this.x - e.x)**2 + (this.y - e.y)**2 <= (r + e.radius)**2) { e.takeDamage(actualDmg, w.name); e.applyElement(w.element); } });
                        w.timer = Math.max(0.5, actualCd);
                    }
                }
            }
        });
    }
    gainExp(amt) {
        window.GG.state.player.exp += amt * this.expMulti;
        if(window.GG.state.player.exp >= window.GG.state.player.exp_next) { 
            window.GG.state.player.exp -= window.GG.state.player.exp_next; window.GG.state.player.level++; window.GG.state.player.exp_next = Math.floor(window.GG.state.player.exp_next * 1.5); 
            triggerLevelUp(); 
        }
        UI.expBar.style.width = `${(window.GG.state.player.exp / window.GG.state.player.exp_next) * 100}%`;
    }
}

class Companion {
    constructor(x, y) { this.x = x; this.y = y; this.radius = 12; this.speed = 180; this.markedForDeath = false; this.hp = 500; this.maxHp = 500; this.timer = 60; this.damage = 25; this.atkTimer = 0; }
    update(dt) {
        this.timer -= dt; if(this.timer <= 0) this.markedForDeath = true;
        let closest = enemies.reduce((c, e) => { let dSq = (this.x-e.x)**2 + (this.y-e.y)**2; return dSq < c.dSq ? {e: e, dSq: dSq} : c; }, {e: null, dSq: Infinity});
        if(closest.e) {
            let dx = closest.e.x - this.x; let dy = closest.e.y - this.y; let d = Math.sqrt(closest.dSq);
            if (d > 100) { this.x += (dx/d)*this.speed*dt; this.y += (dy/d)*this.speed*dt; }
            this.atkTimer -= dt;
            if(this.atkTimer <= 0 && d < 300) { projectiles.push(new Projectile(this.x, this.y, dx/d, dy/d, this.damage, '飛劍', 'normal', 1)); this.atkTimer = 1.0; SoundManager.shoot(); }
        } else { let dx = player.x - this.x; let dy = player.y - this.y; let dSq = dx*dx + dy*dy; if(dSq > 6400) { let d = Math.sqrt(dSq); this.x += (dx/d)*this.speed*dt; this.y += (dy/d)*this.speed*dt; } }
    }
    draw(ctx, cam) {
        let dx = this.x - cam.x; let dy = this.y - cam.y;
        ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(dx, dy + 8, 12, 6, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#2980b9'; ctx.beginPath(); ctx.arc(dx, dy, this.radius, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#00f2fe'; ctx.lineWidth = 2; ctx.stroke();
    }
}

class Enemy {
    constructor(x, y, type) {
        this.x = x; this.y = y; this.type = type; this.markedForDeath = false; this.attackCooldown = 0; this.status = { burn: 0, freeze: 0 };
        let diff = window.GG.wave.getDifficulty(gameState.time, gameState.maxTime);
        let baseHp = 30, baseDmg = 10, baseSpeed = 50;
        
        if(type === 'boss') { baseHp = 5000; baseDmg = 40; baseSpeed = 70; this.radius = 35; this.color = '#f1c40f'; }
        else if(type.includes('elite')) { baseHp = 1000; baseDmg = 25; baseSpeed = 60; this.radius = 25; this.color = '#c0392b'; }
        else { baseHp = 30; baseDmg = 10; baseSpeed = 50 + (Math.random()*25); this.radius = 12; this.color = '#2ecc71'; }
        
        // 公平公式：HP 與傷害受時間與難度曲線影響
        this.maxHp = baseHp * diff.hpMulti; this.damage = baseDmg * diff.dmgMulti; this.hp = this.maxHp; this.speed = baseSpeed;
    }
    update(dt) {
        let currentSpeed = this.speed;
        if(this.status.freeze > 0) { this.status.freeze -= dt; currentSpeed *= 0.3; }
        if(this.status.burn > 0) { this.status.burn -= dt; this.takeDamage(10 * dt, null); }

        let dx = player.x - this.x; let dy = player.y - this.y; let distSq = dx*dx + dy*dy;
        if(distSq > 0) { let d = Math.sqrt(distSq); this.x += (dx/d) * currentSpeed * dt; this.y += (dy/d) * currentSpeed * dt; }
        if (this.attackCooldown > 0) this.attackCooldown -= dt;
        if (distSq < (this.radius + player.radius)**2 && this.attackCooldown <= 0) { takePlayerDamage(this.damage); this.attackCooldown = 1.0; }
    }
    takeDamage(dmg, sourceWeapon) {
        this.hp -= dmg; floatTexts.push(new FloatText(this.x, this.y - 20, Math.floor(dmg), '#fff'));
        if(sourceWeapon) window.GG.state.mastery[sourceWeapon] = (window.GG.state.mastery[sourceWeapon] || 0) + 1;
        if(this.hp <= 0 && !this.markedForDeath) {
            this.markedForDeath = true; SoundManager.hit();
            if (this.type.includes('boss')) { drops.push(new Drop(this.x, this.y, 'chest')); window.GG.res.add('cores', 2); }
            else if (this.type.includes('elite')) { 
                let mats = window.GG.materials.breakthrough;
                let d = new Drop(this.x, this.y, 'material'); d.matName = mats[Math.floor(Math.random()*mats.length)]; drops.push(d);
            } else {
                if(Math.random() < 0.1) drops.push(new Drop(this.x, this.y, 'stones')); else drops.push(new Drop(this.x, this.y, 'exp', 5));
            }
        }
    }
    applyElement(el) { if (el === 'fire') this.status.burn = 3.0; else if (el === 'ice') this.status.freeze = 2.0; }
    draw(ctx, cam) {
        let dx = this.x - cam.x; let dy = this.y - cam.y;
        // 2.5D 立體底部陰影
        ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.ellipse(dx, dy + this.radius*0.7, this.radius*0.9, this.radius*0.4, 0, 0, Math.PI*2); ctx.fill();
        
        ctx.save();
        if (this.type.includes('elite') || this.type.includes('boss')) {
            ctx.shadowColor = this.color; ctx.shadowBlur = 15; // 妖氣光暈特效
            ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(dx, dy, this.radius, 0, Math.PI*2); ctx.fill();
            if(this.type === 'boss') { ctx.font = "20px Arial"; ctx.fillText("👑", dx-10, dy-this.radius-10); }
        } else {
            ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(dx, dy, this.radius, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ff4757'; ctx.beginPath(); ctx.arc(dx - 4, dy - 2, 2, 0, Math.PI*2); ctx.arc(dx + 4, dy - 2, 2, 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();

        if(this.hp < this.maxHp) { ctx.fillStyle = 'red'; ctx.fillRect(dx - 12, dy - this.radius - 8, 24, 3); ctx.fillStyle = '#2ecc71'; ctx.fillRect(dx - 12, dy - this.radius - 8, 24 * (this.hp/this.maxHp), 3); }
    }
}

class Projectile {
    constructor(x, y, vx, vy, dmg, name, el, pierce) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.speed = 500; this.damage = dmg; this.life = 2.0; this.markedForDeath = false; this.element = el; this.pierce = pierce; this.hitTargets = []; this.name = name;
    }
    update(dt) {
        this.x += this.vx * this.speed * dt; this.y += this.vy * this.speed * dt;
        this.life -= dt; if(this.life <= 0) this.markedForDeath = true;
        for(let e of enemies) {
            let distSq = (this.x - e.x)**2 + (this.y - e.y)**2;
            if(distSq < (e.radius + 10)**2 && !this.hitTargets.includes(e)) {
                e.takeDamage(this.damage, this.name); e.applyElement(this.element); this.hitTargets.push(e); this.pierce--;
                if(this.pierce <= 0) { this.markedForDeath = true; break; }
            }
        }
    }
    draw(ctx, cam) {
        let dx = this.x - cam.x; let dy = this.y - cam.y;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter'; // 法術高光
        if (this.name.includes('劍') || this.name.includes('斬')) {
            let angle = Math.atan2(this.vy, this.vx); ctx.translate(dx, dy); ctx.rotate(angle);
            ctx.fillStyle = '#ecf0f1'; ctx.strokeStyle = '#3498db'; ctx.lineWidth=2;
            ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-10, 5); ctx.lineTo(-10, -5); ctx.closePath(); ctx.fill(); ctx.stroke();
        } else {
            ctx.fillStyle = this.element === 'fire' ? '#ff4757' : (this.element === 'lightning' ? '#9b59b6' : '#3498db'); 
            ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle;
            ctx.beginPath(); ctx.arc(dx, dy, 6, 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();
    }
}

class AoeEffect {
    constructor(x, y, radius, element) { this.x = x; this.y = y; this.maxRadius = radius; this.radius = 0; this.life = element==='poison'?5.0:0.3; this.element = element; this.markedForDeath = false; }
    update(dt) { if(this.element === 'poison') { this.radius = this.maxRadius; this.life -= dt; } else { this.radius += (this.maxRadius - this.radius) * 12 * dt; this.life -= dt; } if(this.life <= 0) this.markedForDeath = true; }
    draw(ctx, cam) { 
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = this.element==='poison'? `rgba(46, 204, 113, ${Math.min(1, this.life)})` : `rgba(241, 196, 15, ${this.life * 3})`; 
        ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(this.x - cam.x, this.y - cam.y, this.radius, 0, Math.PI*2); ctx.stroke(); 
        ctx.restore();
    }
}

class Drop {
    constructor(x, y, type, expVal=0) { this.x = x; this.y = y; this.type = type; this.exp = expVal; this.markedForDeath = false; }
    update(dt) {
        let dx = player.x - this.x; let dy = player.y - this.y; let distSq = dx*dx + dy*dy;
        if(distSq < player.pickupRadius**2) {
            let d = Math.sqrt(distSq);
            this.x += (dx/d) * 500 * dt; this.y += (dy/d) * 500 * dt;
        }
        if(distSq < 25**2) {
            this.markedForDeath = true; SoundManager.pickup();
            if(this.type === 'material') {
                window.GG.state.inventory.items[this.matName] = (window.GG.state.inventory.items[this.matName] || 0) + 1;
                floatTexts.push(new FloatText(player.x, player.y, `獲得【${this.matName}】`, '#00f2fe'));
                window.GG.save.save(window.GG.state);
            } else if(this.type === 'stones') { window.GG.res.add('stones', 5); }
            else if(this.type === 'chest') { triggerChest(); }
            else { player.gainExp(this.exp); }
        }
    }
    draw(ctx, cam) {
        let dx = this.x - cam.x; let dy = this.y - cam.y + Math.sin(gameState.time * 6) * 4;
        if(this.type === 'material') { ctx.font = "18px Arial"; ctx.fillText("🌿", dx-9, dy+6); }
        else if(this.type === 'stones') { ctx.font = "18px Arial"; ctx.fillText("💎", dx-9, dy+6); }
        else if(this.type === 'chest') { ctx.font = "24px Arial"; ctx.fillText("🎁", dx-12, dy+8); }
        else { ctx.fillStyle = '#3498db'; ctx.beginPath(); ctx.arc(dx, dy, 4, 0, Math.PI*2); ctx.fill(); }
    }
}

class FloatText {
    constructor(x, y, text, color='#fff') { this.x = x; this.y = y; this.text = text; this.life = 0.8; this.color = color; this.markedForDeath = false; }
    update(dt) { this.y -= 40 * dt; this.life -= dt; if(this.life <= 0) this.markedForDeath = true; }
    draw(ctx, cam) { ctx.fillStyle = this.color; ctx.globalAlpha = Math.min(1, this.life * 2); ctx.fillText(this.text, this.x - cam.x, this.y - cam.y); ctx.globalAlpha = 1.0; }
}

/** ==========================================
 *  五、主迴圈與 Y-Sorting 渲染引擎 (Loop & Render)
 *  ========================================== */
const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true); window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// 搖桿控制：阻止預設滾動，保留觸控行為
let joyActive = false, joyCenter = {x: 0, y: 0};
UI.joyBase.addEventListener('touchstart', e => { e.preventDefault(); joyActive = true; let rect = UI.joyBase.getBoundingClientRect(); joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 }; handleJoy(e.touches[0]); }, {passive:false});
UI.joyBase.addEventListener('touchmove', e => { e.preventDefault(); if(joyActive) handleJoy(e.touches[0]); }, {passive:false});
window.addEventListener('touchend', () => { joyActive = false; joyInput.x = 0; joyInput.y = 0; UI.joyStick.style.transform = `translate(0px, 0px)`; });

function handleJoy(t) {
    let dx = t.clientX - joyCenter.x; let dy = t.clientY - joyCenter.y; let len = Math.hypot(dx, dy); let maxDist = 40;
    if(len > maxDist) { dx = (dx/len)*maxDist; dy = (dy/len)*maxDist; }
    UI.joyStick.style.transform = `translate(${dx}px, ${dy}px)`; joyInput.x = dx / maxDist; joyInput.y = dy / maxDist;
}
function toggleAuto() { gameState.isAutoPilot = !gameState.isAutoPilot; if (gameState.isAutoPilot) UI.autoBtn.classList.add('auto-active'); else { UI.autoBtn.classList.remove('auto-active'); kbInput.x=0; kbInput.y=0; } }

function update() {
    if(!gameState.isRunning) return;
    let now = performance.now(); 
    if (window.GG.runtime.last_frame_time === null) { window.GG.runtime.last_frame_time = now; requestAnimationFrame(update); return; }
    let dtMs = now - window.GG.runtime.last_frame_time; window.GG.runtime.last_frame_time = now;
    if (dtMs <= 0 || dtMs > 250) { requestAnimationFrame(update); return; }
    let dt = dtMs / 1000; gameState.time += dt;

    if (!gameState.isAutoPilot) {
        if(keys['w'] || keys['arrowup']) kbInput.y = -1; else if(keys['s'] || keys['arrowdown']) kbInput.y = 1; else kbInput.y = 0;
        if(keys['a'] || keys['arrowleft']) kbInput.x = -1; else if(keys['d'] || keys['arrowright']) kbInput.x = 1; else kbInput.x = 0;
    }

    try {
        player.update(dt); 
        companions.forEach(c => c.update(dt)); companions = companions.filter(c => !c.markedForDeath);
        
        let r = Math.max(canvas.width, canvas.height) / 2 + 50;
        spawnerTimer += dt;
        let targetDelay = window.GG.wave.tick(dt, gameState.time, gameState.maxTime, enemies.length);
        if (targetDelay !== null && spawnerTimer > targetDelay) { 
            spawnerTimer = 0; let ang = Math.random() * Math.PI * 2; 
            let type = Math.random() < 0.05 ? 'elite_blood' : (Math.random() < 0.01 ? 'boss' : 'normal');
            enemies.push(new Enemy(player.x + Math.cos(ang)*r, player.y + Math.sin(ang)*r, type)); 
        }

        // 大世界事件：礦山與寶箱生成 (保留 Demo-006 功能)
        if (Math.random() < 0.001) { let ang = Math.random() * Math.PI * 2; drops.push(new Drop(player.x + Math.cos(ang)*300, player.y + Math.sin(ang)*300, 'chest')); }

        projectiles.forEach(p => p.update(dt)); projectiles = projectiles.filter(p => !p.markedForDeath);
        aoeEffects.forEach(a => a.update(dt)); aoeEffects = aoeEffects.filter(a => !a.markedForDeath);
        enemies.forEach(e => e.update(dt)); enemies = enemies.filter(e => !e.markedForDeath);
        drops.forEach(d => d.update(dt)); drops = drops.filter(d => !d.markedForDeath);
        floatTexts.forEach(f => f.update(dt)); floatTexts = floatTexts.filter(f => !f.markedForDeath);

        let rem = Math.max(0, gameState.maxTime - gameState.time); let mins = Math.floor(rem / 60); let secs = Math.floor(rem % 60);
        UI.timer.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        UI.stats.innerHTML = `境界: ${window.GG.state.player.realm} ${window.GG.state.player.level} 層<br>靈石: ${window.GG.state.inventory.spirit_stones} | 妖丹: ${window.GG.state.inventory.cores}<br>氣血: ${Math.floor(window.GG.state.player.hp_current)}/${window.GG.state.player.hp_max}`;

        draw();
    } catch(err) { console.error("迴圈防呆攔截：", err); }
    requestAnimationFrame(update);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height); 
    
    // 繪製八荒地圖網格 (靈氣氛圍)
    ctx.strokeStyle = '#1a2a2a'; ctx.lineWidth = 2; let gridSize = 100;
    let ox = -(gameState.camera.x % gridSize); let oy = -(gameState.camera.y % gridSize);
    ctx.beginPath(); for(let x = ox; x < canvas.width; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); } for(let y = oy; y < canvas.height; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); } ctx.stroke();

    // 🌟 Demo-008 核心：2.5D Y-Sorting (縱深排序)
    let renderQueue = [];
    if (player && window.GG.state.player.hp_current > 0) renderQueue.push({ y: player.y, type: 'player', obj: player });
    enemies.forEach(e => renderQueue.push({ y: e.y, type: 'enemy', obj: e }));
    companions.forEach(c => renderQueue.push({ y: c.y, type: 'companion', obj: c }));
    drops.forEach(d => renderQueue.push({ y: d.y, type: 'drop', obj: d }));

    renderQueue.sort((a, b) => a.y - b.y);

    renderQueue.forEach(item => {
        if (item.type === 'drop') item.obj.draw(ctx, gameState.camera);
        else if (item.type === 'companion') item.obj.draw(ctx, gameState.camera);
        else if (item.type === 'player') drawAdvancedPlayer(item.obj, ctx, gameState.camera);
        else if (item.type === 'enemy') item.obj.draw(ctx, gameState.camera);
    });

    aoeEffects.forEach(a => a.draw(ctx, gameState.camera));
    projectiles.forEach(p => p.draw(ctx, gameState.camera));
    ctx.font = "bold 14px Arial"; ctx.textAlign = "center"; floatTexts.forEach(f => f.draw(ctx, gameState.camera));
}

function drawAdvancedPlayer(p, ctx, cam) {
    let dx = p.x - cam.x; let dy = p.y - cam.y;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(dx, dy + 10, 15, 6, 0, 0, Math.PI*2); ctx.fill();
    let avatarCache = window.GG.avatar.getPlayerCache();
    if (avatarCache) { ctx.drawImage(avatarCache, dx - 32, dy - 32); }
    else { ctx.fillStyle = '#3498db'; ctx.beginPath(); ctx.arc(dx, dy, p.radius, 0, Math.PI*2); ctx.fill(); }
    ctx.fillStyle = 'red'; ctx.fillRect(dx - 15, dy + 35, 30, 4); ctx.fillStyle = '#2ecc71'; ctx.fillRect(dx - 15, dy + 35, 30 * (Math.max(0, window.GG.state.player.hp_current)/window.GG.state.player.hp_max), 4);
}

function takePlayerDamage(dmg) {
    let finalDmg = Math.max(1, dmg - window.GG.state.player.def); window.GG.res.sub('hp', finalDmg);
    UI.dmgOverlay.style.opacity = 1; setTimeout(() => UI.dmgOverlay.style.opacity = 0, 150);
    if(window.GG.state.player.hp_current <= 0) { gameState.isRunning = false; document.getElementById('gameover-modal').style.display = 'block'; window.GG.save.save(window.GG.state); }
}

// 武器全家桶恢復 (保留 Demo-006 的 7 大武器升級池)
function triggerLevelUp() {
    gameState.isRunning = false; document.getElementById('levelup-modal').style.display = 'block';
    const basePool = [
        { name: '清風劍訣', desc: '提升基礎劍氣傷害與頻率', action: () => player.addWeapon('清風劍氣', 'projectile', 15, 1.0, 'normal', 1) },
        { name: '八卦劍陣', desc: '周圍大範圍陣法攻擊', action: () => player.addWeapon('八卦劍陣', 'aoe', 20, 3.0, 'normal', 1, 120) },
        { name: '三昧真火', desc: '發射可點燃敵人的火球', action: () => player.addWeapon('三昧真火', 'projectile', 25, 1.5, 'fire', 2) },
        { name: '寒冰護盾', desc: '環繞自身的防禦冰劍', action: () => player.addWeapon('玄冰護盾', 'orbit', 10, 0, 'ice', 99, 60) },
        { name: '九霄雷劫', desc: '彈射閃電，麻痺敵人', action: () => player.addWeapon('九霄雷劫', 'projectile', 18, 1.8, 'lightning', 3) },
        { name: '幽冥毒沼', desc: '原地留下持續扣血的毒圈', action: () => player.addWeapon('幽冥毒沼', 'aoe', 5, 2.5, 'poison', 1, 80) },
        { name: '裂空斬', desc: '發射可無限穿透的半月斬', action: () => player.addWeapon('裂空斬', 'projectile', 30, 2.0, 'normal', 99) }
    ];
    let options = basePool.sort(() => 0.5 - Math.random()).slice(0, 4); document.getElementById('upgrade-options').innerHTML = '';
    options.forEach(opt => {
        let isHigh = Math.random() < 0.2; let finalName = opt.name, finalDesc = opt.desc, actionWrapper = opt.action;
        if (isHigh) {
            let af = [{prefix:'[極速]', d: '(減CD)', mod: w=>{w.baseCd*=0.6;}}, {prefix:'[天道]', d: '(雙倍傷)', mod: w=>{w.baseDmg*=2;}}][Math.floor(Math.random()*2)];
            finalName = af.prefix + finalName; finalDesc += af.d; actionWrapper = () => { opt.action(); let w = player.weapons.find(w=>w.name===opt.name); if(w) af.mod(w); };
        }
        let div = document.createElement('div'); div.className = isHigh ? 'card affix-high' : 'card';
        div.innerHTML = `<div class="card-title">${finalName}</div><div style="font-size:12px; margin-top:5px; color:#aaa;">${finalDesc}</div>`;
        div.onclick = () => { actionWrapper(); document.getElementById('levelup-modal').style.display = 'none'; gameState.lastTime = performance.now(); gameState.isRunning = true; requestAnimationFrame(update); };
        document.getElementById('upgrade-options').appendChild(div);
    });
}

function triggerChest() {
    gameState.isRunning = false; document.getElementById('chest-modal').style.display = 'block';
    let rewards = ["獲得 5 顆妖丹與 50 靈石！", "獲得 20 個玄鐵！", "所有武器等級 +1！"];
    let rIdx = Math.floor(Math.random() * rewards.length); document.getElementById('chest-reward').innerText = rewards[rIdx];
    if (rIdx === 0) { window.GG.res.add('cores', 5); window.GG.res.add('stones', 50); } else if (rIdx === 1) window.GG.res.add('irons', 20); else player.weapons.forEach(w => w.level++);
}
function closeChest() { document.getElementById('chest-modal').style.display = 'none'; gameState.lastTime = performance.now(); gameState.isRunning = true; requestAnimationFrame(update); }

function togglePause() {
    if(gameState.isRunning) { gameState.isRunning = false; document.getElementById('pause-modal').style.display = 'block'; } 
    else { document.getElementById('pause-modal').style.display = 'none'; gameState.lastTime = performance.now(); gameState.isRunning = true; requestAnimationFrame(update); }
}

/** ==========================================
 *  六、局外 HUB 與 創角引導 (UI & Hub Restoration)
 *  ========================================== */
let tempPlayerState = null;
function switchStartStep(step) {
    document.getElementById('ui-step-1').style.display = 'none'; document.getElementById('ui-step-2').style.display = 'none'; document.getElementById('ui-step-3').style.display = 'none';
    document.getElementById(`ui-step-${step}`).style.display = 'block';
    if(step === 2 && !tempPlayerState) rollStats(); 
}

function rollStats() {
    SoundManager.init(); SoundManager.hit();
    tempPlayerState = { hp_max: Math.floor(100 * (0.8 + Math.random()*0.4)), mp_max: Math.floor(50 * (0.8 + Math.random()*0.4)), atk: Math.floor(10 * (0.8 + Math.random()*0.4)), def: Math.floor(5 * (0.8 + Math.random()*0.4)), int: Math.floor(80 * (0.7 + Math.random()*0.6)), luck: Math.floor(80 * (0.7 + Math.random()*0.6)), traits: [] };
    let pool = [...window.GG.traits];
    for(let i=0; i<3; i++) { let idx = Math.floor(Math.random() * pool.length); tempPlayerState.traits.push(pool[idx]); pool.splice(idx, 1); }
    
    document.getElementById('roll-hp').innerText = tempPlayerState.hp_max; document.getElementById('roll-mp').innerText = tempPlayerState.mp_max; document.getElementById('roll-atk').innerText = tempPlayerState.atk; document.getElementById('roll-def').innerText = tempPlayerState.def; document.getElementById('roll-int').innerText = tempPlayerState.int; document.getElementById('roll-luck').innerText = tempPlayerState.luck;
    let traitsHtml = ""; tempPlayerState.traits.forEach(t => { traitsHtml += `<div style="color:${t.color}; font-weight:bold; margin-bottom:4px;">【${t.name}】</div><div style="font-size:12px; color:#aaa; margin-bottom:8px;">${t.desc}</div>`; });
    document.getElementById('roll-traits').innerHTML = traitsHtml;
}

function applyStatsAndNext() {
    if(!tempPlayerState) return;
    let p = window.GG.state.player;
    // 局外養成累加：保留玩家在洞府買的永久屬性，並加上新 Roll 到的屬性
    p.hp_max += tempPlayerState.hp_max; p.hp_current = p.hp_max; p.mp_max += tempPlayerState.mp_max; p.mp_current = p.mp_max; 
    p.atk += tempPlayerState.atk; p.def += tempPlayerState.def; p.int = tempPlayerState.int; p.luck = tempPlayerState.luck;
    tempPlayerState.traits.forEach(t => t.apply(p));
    switchStartStep(3);
}

function hoverSect(sect) {
    let text = sect === 'sword' ? "「青雲劍宗，專修飛劍，攻速極快，自帶『清風劍氣』。」" : (sect === 'magic' ? "「焚天谷，專修五行火術，大範圍灼燒，自帶『三昧真火』。」" : "「極道體宗，修煉艱難但生存力極強，自帶『玄冰護盾』。」");
    document.getElementById('sect-dialogue').innerText = text;
}
function selectSectDialogue(sect) { chosenSect = sect; document.getElementById('time-selection-new').style.display = 'block'; }
function confirmStart(timeLimit) {
    document.getElementById('start-modal').style.display = 'none'; UI.layer.style.display = 'block';
    gameState.maxTime = timeLimit; gameState.spawns = {}; gameState.sosSpawned = false; 
    player = new Player(chosenSect);
    gameState.lastTime = performance.now(); gameState.isRunning = true; requestAnimationFrame(update);
}

// 🌟 局外 HUB 完全還原 (商店、材料、武學、洞府、尋仙堂)
let hubReturnTo = 'start';
function openHub(from, tab='shop') {
    SoundManager.init(); hubReturnTo = from;
    document.getElementById('start-modal').style.display = 'none'; document.getElementById('pause-modal').style.display = 'none'; document.getElementById('gameover-modal').style.display = 'none';
    document.getElementById('hub-modal').style.display = 'block'; switchHubTab(tab);
}
function closeHub() {
    document.getElementById('hub-modal').style.display = 'none';
    if(hubReturnTo === 'start') document.getElementById('start-modal').style.display = 'block';
    else document.getElementById('pause-modal').style.display = 'block';
}
function switchHubTab(tab) {
    document.querySelectorAll('#hub-modal .nav-tab').forEach(e => e.classList.remove('active')); document.getElementById('tab-'+tab).classList.add('active');
    document.getElementById('hub-stones').innerText = window.GG.state.inventory.spirit_stones; document.getElementById('hub-cores').innerText = window.GG.state.inventory.cores; document.getElementById('hub-irons').innerText = window.GG.state.inventory.irons;
    let html = '';
    if(tab === 'shop') {
        html += `<div class="card" onclick="buyShopItem('atk', 50, 2)"><div class="card-title">一品攻擊靈果</div><div style="font-size:12px; color:#aaa;">永久攻+2 (50靈石)</div></div>`;
        html += `<div class="card" onclick="buyShopItem('def', 40, 2)"><div class="card-title">一品防禦靈果</div><div style="font-size:12px; color:#aaa;">永久防+2 (40靈石)</div></div>`;
        html += `<div class="card" onclick="buyShopItem('hp_max', 60, 50)"><div class="card-title">培元造化丹</div><div style="font-size:12px; color:#aaa;">永久血量+50 (60靈石)</div></div>`;
    } else if (tab === 'materials') {
        let items = window.GG.state.inventory.items; html += `<h4 style="color:#2ecc71; margin-top:0;">擁有天材地寶：</h4>`;
        for(let k in items) { html += `<span style="display:inline-block; margin:5px; padding:5px; background:#222; border:1px solid #555; border-radius:3px;">${k}: ${items[k]}</span>`; }
        if(Object.keys(items).length === 0) html += `<div style="color:#777;">暫無材料，擊敗精英怪以獲取。</div>`;
    } else if (tab === 'mastery') {
        let mastery = window.GG.state.mastery; let keys = Object.keys(mastery);
        if(keys.length === 0) html = `<div style="text-align:center; color:#777; padding:20px;">尚無武學熟練度<br>實戰中釋放武器可提升</div>`;
        keys.forEach(k => { html += `<div class="card"><div class="card-title">${k} (Lv.${mastery[k]})</div><div style="font-size:12px; color:#2ecc71;">傷害額外加成 +${(mastery[k]*1.5).toFixed(1)}%</div></div>`; });
    } else if (tab === 'cave') {
        let p = window.GG.state.player;
        html += `<div style="text-align:center; padding:15px; border:1px solid #2ecc71; border-radius:5px;"><h3 style="color:#2ecc71; margin-top:0;">當前境界：${p.realm} (${p.level}層)</h3><p style="font-size:12px; color:#aaa;">消耗妖丹與玄鐵進行大境界突破！</p><button class="btn" style="background:#2ecc71; color:#000;" onclick="breakthroughRealm()">嘗試突破 (需5妖丹 10玄鐵)</button></div>`;
    } else if (tab === 'gacha') {
        html += `<div style="text-align:center; padding: 15px; border:1px solid #c9a562; border-radius:5px;"><h3 style="color:#c9a562; margin-top:0;">尋仙堂 (招募道侶)</h3><p style="font-size:12px; color:#aaa;">消耗靈石招募道侶隨行支援！</p><button class="btn" onclick="drawCompanion()">尋訪道友 (消耗 100 靈石)</button></div>`;
    }
    document.getElementById('hub-content').innerHTML = html;
}
function buyShopItem(stat, cost, val) {
    if(window.GG.state.inventory.spirit_stones >= cost) { window.GG.state.inventory.spirit_stones -= cost; window.GG.state.player[stat] += val; window.GG.save.save(window.GG.state); switchHubTab('shop'); SoundManager.pickup(); } else alert("靈石不足！");
}
function breakthroughRealm() {
    let inv = window.GG.state.inventory;
    if(inv.cores >= 5 && inv.irons >= 10) {
        inv.cores -= 5; inv.irons -= 10; let p = window.GG.state.player; p.atk += 15; p.hp_max += 200; p.hp_current = p.hp_max; p.def += 5;
        p.realm = p.realm === '練氣期' ? '築基期' : (p.realm === '築基期' ? '結丹期' : '元嬰期');
        window.GG.save.save(window.GG.state); alert(`突破成功！當前境界：${p.realm}`); switchHubTab('cave');
    } else alert("突破材料不足 (需 5妖丹 10玄鐵)！");
}
function drawCompanion() {
    if(window.GG.state.inventory.spirit_stones >= 100) { window.GG.state.inventory.spirit_stones -= 100; window.GG.save.save(window.GG.state); SoundManager.pickup(); alert("尋仙成功！道侶將在下次出戰時隨行。"); } else alert("靈石不足！");
}

setTimeout(() => { if(document.getElementById('avatar-preview-canvas')) window.GG.avatar.refreshPlayerPreview(); }, 100);
